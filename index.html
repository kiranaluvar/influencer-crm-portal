  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      --brand:      #4060f0;
      --brand-dark: #3050e0;
      --brand-soft: #eaf0ff;
      --bc-yellow:  #f0d000;
      --bc-orange:  #f08000;
      --bc-green:   #40d060;
      --bc-cyan:    #40c0f0;
      --bc-red:     #f04040;
    }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .btn-brand { background-color: var(--brand); color: white; }
    .btn-brand:hover { background-color: var(--brand-dark); }
    .btn-brand:disabled { opacity: 0.5; cursor: not-allowed; }
    .text-brand { color: var(--brand); }
    .text-brand:hover { color: var(--brand-dark); }
    .border-brand { border-color: var(--brand); }
    .ring-brand:focus { box-shadow: 0 0 0 2px var(--brand); outline: none; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 3px; }
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
    .modal-backdrop { background: rgba(15,23,42,0.5); backdrop-filter: blur(2px); }
    .fade-in { animation: fade 0.15s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes confetti-fall {
      0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) translateX(var(--drift)) rotate(var(--spin)); opacity: 0.9; }
    }
    .confetti-piece { position: fixed; top: 0; z-index: 9999; pointer-events: none; will-change: transform; animation: confetti-fall linear forwards; }
    @media (max-width: 768px) {
      .sidebar-mobile { transform: translateX(-100%); transition: transform 0.2s; }
      .sidebar-mobile.open { transform: translateX(0); }
    }
    /* Heatmap cell colors */
    .heatmap-cell { color: #fff; font-size: 11px; padding: 4px 6px; text-align: center; min-width: 32px; }
    /* Responsive table rows: stack vertically on mobile */
    @media (max-width: 767px) {
      .crm-row {
        grid-template-columns: 1fr !important;
        row-gap: 6px;
        padding: 14px 16px;
      }
      .crm-row > * { min-width: 0; }
      .crm-row .crm-avatar { display: none; }
      .crm-row-cell-secondary { color: #64748b; font-size: 12px; }
    }
  </style>
</head>

      const startOfDay = (x) => { const y = new Date(x); y.setHours(0,0,0,0); return y; };
      const diffDays = Math.round((startOfDay(now) - startOfDay(dt)) / 86400000);
      const time = dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: false });

    function kpiTile(label, value, valueColor = 'text-stone-900') {

    // Reusable multi-select filter — checkbox popover instead of a native single-select.
    // Standard component for ALL filter dropdowns going forward (people always need to pick more than one).
    // options: array of strings, or array of {value, label}. onChange receives the full array of selected values.
    function multiSelectFilter(label, options, selected, onChange) {
      const normOpts = options.map(o => typeof o === 'string' ? { value: o, label: o } : o);
      const sel = new Set(selected || []);
      const btn = el('button', { type: 'button', class: 'px-3 py-2 text-sm border border-stone-200 rounded-lg bg-white hover:bg-stone-50 flex items-center gap-1.5 whitespace-nowrap' });

      const btnLabel = el('span', {});
      btn.appendChild(btnLabel); btn.appendChild(caret);
      const renderLabel = () => { btnLabel.textContent = sel.size ? `${label} (${sel.size})` : `All ${label.toLowerCase()}`; };
      renderLabel();

      const panel = el('div', { class: 'ms-panel absolute z-20 mt-1 bg-white border border-stone-200 rounded-lg shadow-lg p-1.5 max-h-64 overflow-y-auto hidden', style: 'min-width:200px;' });
      normOpts.forEach(o => {
        const cb = el('input', { type: 'checkbox', checked: sel.has(o.value), class: 'rounded border-stone-300 text-blue-600 focus:ring-blue-500' });
        cb.addEventListener('change', () => {
          if (cb.checked) sel.add(o.value); else sel.delete(o.value);
          renderLabel();
          onChange(Array.from(sel));
        });
        panel.appendChild(el('label', { class: 'flex items-center gap-2 px-2 py-1.5 text-sm hover:bg-stone-50 rounded-lg cursor-pointer' }, cb, o.label));
      });

      const wrap = el('div', { class: 'relative inline-block' }, btn, panel);
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        $$('.ms-panel').forEach(p => { if (p !== panel) p.classList.add('hidden'); });
        panel.classList.toggle('hidden');
      });
      document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) panel.classList.add('hidden'); });
      return wrap;
    }

    function pipelineStrip(counts, onClick) {
      // counts: array of { group, count } in canonical order
      const order = ['Scraping','Screening','Negotiation','Documents','Integration Planning','Gone Live','Post Gone Live','Dropped'];
      const variants = { 'Scraping':'slate', 'Screening':'info', 'Negotiation':'warning', 'Integration Planning':'purple', 'Documents':'indigo', 'Gone Live':'success', 'Post Gone Live':'livedark', 'Dropped':'rose' };
      const labels =   { 'Scraping':'Scraping', 'Screening':'Screening', 'Negotiation':'Negotiation', 'Integration Planning':'Integration Planning', 'Documents':'Documents', 'Gone Live':'Gone Live', 'Post Gone Live':'Post Live', 'Dropped':'Dropped' };
      const lookup = Object.fromEntries((counts || []).map(c => [c.group, c.count]));
      return el('div', { class: 'grid grid-cols-4 sm:grid-cols-8 gap-1.5 mb-5' },
        ...order.map(g => {
          const v = variants[g];
          const cls = subtleBadge('', v).className; // reuse color mapping
          return el('button', {
            class: `text-left px-3 py-2 rounded-lg ${cls.replace('inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium ','')} hover:ring-1 hover:ring-stone-300 transition`,
            onClick: () => onClick && onClick(g),
          },
            el('div', { class: 'text-[10px] uppercase tracking-wide font-medium opacity-80' }, labels[g]),
            el('div', { class: 'text-[16px] font-semibold mt-0.5' }, String(lookup[g] || 0))
          );
        })
      );
    }

      const t = el('div', { class: `fixed bottom-6 left-1/2 -translate-x-1/2 ${colors[type]} text-white text-sm px-4 py-2 rounded-xl shadow-lg z-50 fade-in` }, msg);

    // Confetti burst for the "campaign just went Gone Live" moment — pure CSS/JS, no external library.
    function celebrateGoneLive() {
      const colors = ['#4060f0', '#f0d000', '#f08000', '#40d060', '#40c0f0', '#f04040'];
      const count = 90;
      for (let i = 0; i < count; i++) {
        const size = 6 + Math.random() * 6;
        const isCircle = Math.random() > 0.5;
        const piece = el('div', {
          class: 'confetti-piece',
          style: `
            left:${Math.random() * 100}vw;
            width:${size}px; height:${size * (isCircle ? 1 : 0.5)}px;
            background:${colors[Math.floor(Math.random() * colors.length)]};
            border-radius:${isCircle ? '50%' : '2px'};
            --drift:${(Math.random() - 0.5) * 300}px;
            --spin:${(Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 720)}deg;
            animation-duration:${2.5 + Math.random() * 1.5}s;
            animation-delay:${Math.random() * 0.4}s;
          `
        });
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4500);
      }
    }

    // ===============================================================
    // DATA: CAMPAIGNS LIST
    // ===============================================================
    async function fetchCampaigns() {
      const L = state.lists.campaigns;
      const from = (L.page - 1) * PAGE_SIZE;
      const to   = from + PAGE_SIZE - 1;

      const sel = `
        id, name, sub_status, group_status, owner_id, next_followup_at, updated_at, created_at,
        platform:platforms!inner ( id, platform, username, followers, imported_poc, profile:profiles!inner ( id, name, lead_type ) ),
        owner:team_members!campaigns_owner_id_fkey ( full_name )
      `;

      const applyFilters = (q) => {
        if ((L.filters.group_status || []).length) q = q.in('group_status', L.filters.group_status);
        if ((L.filters.sub_status || []).length)   q = q.in('sub_status', L.filters.sub_status);
        if ((L.filters.owner_id || []).length)     q = q.in('owner_id', L.filters.owner_id);
        if ((L.filters.platform || []).length)     q = q.in('platforms.platform', L.filters.platform);
        if (L.filters.date_from)    q = q.gte('created_at', L.filters.date_from);
        if (L.filters.date_to)      q = q.lte('created_at', L.filters.date_to + 'T23:59:59');
        return q;
      };

      if (L.search) {
        // Multi-query merge: search by campaign name, platform username, influencer name in parallel
        const s = L.search;
        const [a, b, c] = await Promise.all([
          applyFilters(supabase.from('campaigns').select(sel)).ilike('name', `%${s}%`).order('updated_at', { ascending: false }).limit(200),
          applyFilters(supabase.from('campaigns').select(sel)).ilike('platforms.username', `%${s}%`).order('updated_at', { ascending: false }).limit(200),
          applyFilters(supabase.from('campaigns').select(sel)).ilike('platforms.profiles.name', `%${s}%`).order('updated_at', { ascending: false }).limit(200),
        ]);
        if (a.error || b.error || c.error) {
          const err = a.error || b.error || c.error;
          console.error(err); toast(err.message, 'error'); return;
        }
        const merged = new Map();
        [a.data, b.data, c.data].forEach(arr => (arr || []).forEach(item => merged.set(item.id, item)));
        const all = Array.from(merged.values()).sort((x, y) => new Date(y.updated_at) - new Date(x.updated_at));
        L.total = all.length;
        L.items = all.slice(from, from + PAGE_SIZE);
      } else {
        let q = applyFilters(supabase.from('campaigns').select(sel, { count: 'exact' }))
          .order('updated_at', { ascending: false }).range(from, to);
        const { data, error, count } = await q;
        if (error) { console.error(error); toast(error.message, 'error'); return; }
        L.items = data || [];
        L.total = count || 0;
      }

      // Pipeline counts for the strip
      const { data: pc } = await supabase.rpc('dashboard_data');
      state.pipelineCounts = pc?.pipeline || [];
    }

    // ===============================================================
    // DATA: PROFILES LIST
    // ===============================================================
    async function fetchProfiles() {
      const L = state.lists.profiles;
      const from = (L.page - 1) * PAGE_SIZE;
      const to   = from + PAGE_SIZE - 1;

      // Use an inner join on platforms only when filtering by platform, so profiles with
      // zero platforms still show up normally the rest of the time.
      const platformJoin = (L.filters.platform || []).length ? 'platforms!inner' : 'platforms';
      let q = supabase.from('profiles').select(`
        id, name, email, phone, region, lead_type, created_at,
        owner:team_members!profiles_created_by_fkey ( full_name ),
        ${platformJoin} ( id, platform, username )
      `, { count: 'exact' });

      if (L.search) q = q.or(`name.ilike.%${L.search}%,email.ilike.%${L.search}%,phone.ilike.%${L.search}%`);
      if ((L.filters.lead_type || []).length) q = q.in('lead_type', L.filters.lead_type);
      if ((L.filters.created_by || []).length) q = q.in('created_by', L.filters.created_by);
      if ((L.filters.region || []).length) q = q.in('region', L.filters.region);
      if ((L.filters.platform || []).length) q = q.in('platforms.platform', L.filters.platform);

      q = q.order('created_at', { ascending: false }).range(from, to);

      const { data, error, count } = await q;
      if (error) { console.error(error); toast(error.message, 'error'); return; }
      L.items = data || [];
      L.total = count || 0;
    }

        el('div', { class: 'px-5 py-3.5 border-b border-stone-200 flex items-center justify-between' },

        el('div', { class: 'p-5 overflow-y-auto scrollbar-thin' }, content)

      backdrop.appendChild(modal);
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });

    // ===============================================================

    function openAddProfileModal(opts) {
      // opts is optional: { prefill: {...}, onSaved: fn }. When used as a click handler, opts is the click event (ignored).
      const prefill = opts && opts.prefill ? opts.prefill : null;
      const onSaved = opts && typeof opts.onSaved === 'function' ? opts.onSaved : null;
      const form = el('div', { class: 'space-y-3' });
      const fields = {};
      const mkField = (label, name, type = 'text', opts = {}) => {
        const wrap = el('label', { class: 'block' },
          el('span', { class: 'text-xs font-medium text-stone-600' }, label + (opts.required ? ' *' : '')),
          fields[name] = el('input', { type, name, placeholder: opts.placeholder || '', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-200 rounded-lg focus:outline-none focus:border-stone-400' })
        );
        return wrap;
      };
      const mkSelect = (label, name, options, opts = {}) => {
        const sel = el('select', { name, class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-200 rounded-lg focus:outline-none focus:border-stone-400' },
          el('option', { value: '' }, '— Select —'),
          ...options.map(o => el('option', { value: o }, o))
        );
        fields[name] = sel;
        return el('label', { class: 'block' },
          el('span', { class: 'text-xs font-medium text-stone-600' }, label + (opts.required ? ' *' : '')),
          sel
        );
      };

      const leadTypeWrap = mkSelect('Lead Type', 'lead_type', ['Phone', 'Email', 'DM'], { required: true });
      const nameWrap     = mkField('Name', 'name');
      const emailWrap    = mkField('Email', 'email', 'email');
      const phoneWrap    = mkField('Phone', 'phone', 'tel');

      // Region: searchable country dropdown
      const regionSel = el('select', { name: 'region', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-200 rounded-lg focus:outline-none focus:border-stone-400' },
        el('option', { value: '' }, '— Select country —'),
        ...COUNTRIES.map(c => el('option', { value: c }, c))
      );
      fields.region = regionSel;
      const regionWrap = el('label', { class: 'block' },
        el('span', { class: 'text-xs font-medium text-stone-600' }, 'Region'),
        regionSel
      );

      // Languages: multi-select checkboxes
      const langBoxes = LANGUAGES.map(l => {
        const cb = el('input', { type: 'checkbox', value: l, class: 'rounded border-stone-300 text-blue-600 focus:ring-blue-500' });
        return el('label', { class: 'inline-flex items-center gap-1 text-xs px-2 py-1 border border-stone-200 rounded bg-stone-50 cursor-pointer hover:bg-stone-100' }, cb, l);
      });
      fields.languages = langBoxes;
      const langWrap = el('div', {},
        el('span', { class: 'text-xs font-medium text-stone-600 block mb-1' }, 'Languages Known'),
        el('div', { class: 'flex flex-wrap gap-1.5' }, ...langBoxes)
      );

      // PLATFORM SECTION (mandatory — source of the lead)
      const platSel = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-200 rounded-lg focus:outline-none focus:border-stone-400' },
        el('option', { value: '' }, '— Select —'),
        ...['Instagram','Youtube','Facebook','Tiktok'].map(p => el('option', { value: p }, p))
      );
      fields.platform = platSel;
      const platWrap = el('label', { class: 'block' },
        el('span', { class: 'text-xs font-medium text-stone-600' }, 'Platform *'),
        platSel
      );
      const usernameWrap = mkField('Username *', 'username');
      const linkWrap     = mkField('Profile Link', 'link', 'url');
      const genreWrap    = mkField('Genre', 'genre');
      const avgViewsWrap = mkField('Avg Views (last 10 collabs)', 'avg_views', 'number');
      const followersWrap = mkField('Followers', 'followers', 'number');

      const hint = el('p', { class: 'text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1.5' });
      const updateHint = () => {
        const lt = fields.lead_type.value;
        if (lt === 'Phone') hint.textContent = 'Phone & Name are required. Phone must be unique system-wide.';
        else if (lt === 'Email') hint.textContent = 'Email & Name are required. Email must be unique system-wide.';
        else if (lt === 'DM') hint.textContent = 'Name is required. DM leads dedupe by name + platform username.';
        else hint.textContent = '';
      };
      fields.lead_type.addEventListener('change', updateHint);

      const sectionHeader = (label) => el('div', { class: 'pt-2 mt-2 border-t border-stone-200' },
        el('div', { class: 'text-[11px] font-semibold uppercase tracking-wide text-stone-500' }, label)
      );

      const submitBtn = el('button', { class: 'px-3 py-1.5 text-sm rounded-lg btn-brand' }, 'Create Profile + Platform');
      submitBtn.addEventListener('click', async () => {
        const checkedLangs = fields.languages.filter(cb => cb.querySelector('input').checked).map(cb => cb.querySelector('input').value);
        const profilePayload = {
          lead_type: fields.lead_type.value,
          name:      fields.name.value.trim(),
          email:     fields.email.value.trim() || null,
          phone:     fields.phone.value.trim() || null,
          region:    fields.region.value || null,
          languages: checkedLangs.length ? checkedLangs : null,
          created_by: state.me.user_id,
        };
        const platformPayload = {
          platform:   fields.platform.value,
          username:   fields.username.value.trim(),
          link:       fields.link.value.trim() || null,
          genre:      fields.genre.value.trim() || null,
          avg_views:  fields.avg_views.value ? parseInt(fields.avg_views.value) : null,
          followers:  fields.followers.value ? parseInt(fields.followers.value) : null,
          created_by: state.me.user_id,
        };

        // Validation
        if (!profilePayload.lead_type) return toast('Pick a lead type', 'error');
        if (!profilePayload.name) return toast('Name is required', 'error');
        if (profilePayload.lead_type === 'Phone' && !profilePayload.phone) return toast('Phone is required for Phone lead', 'error');
        if (profilePayload.lead_type === 'Email' && !profilePayload.email) return toast('Email is required for Email lead', 'error');
        if (!platformPayload.platform) return toast('Platform is required (source of the lead)', 'error');
        if (!platformPayload.username) return toast('Platform username is required', 'error');

        submitBtn.disabled = true; submitBtn.textContent = 'Saving…';

        // 1. Insert profile
        const { data: prof, error: pErr } = await supabase.from('profiles').insert(profilePayload).select().single();
        if (pErr) {
          submitBtn.disabled = false; submitBtn.textContent = 'Create Profile + Platform';
          return toast(pErr.message, 'error');
        }

        // 2. Insert platform; rollback profile if it fails
        platformPayload.profile_id = prof.id;
        const { error: plErr } = await supabase.from('platforms').insert(platformPayload);
        if (plErr) {
          await supabase.from('profiles').delete().eq('id', prof.id);
          submitBtn.disabled = false; submitBtn.textContent = 'Create Profile + Platform';
          return toast('Platform failed: ' + plErr.message + ' (profile rolled back)', 'error');
        }

        modal.close();
        toast('Profile + platform created — default campaign in Scraping', 'success');
        if (onSaved) { try { onSaved(prof); } catch (e) { console.error(e); } }
        if (state.route === 'campaigns') { state.lists.campaigns.page = 1; await fetchCampaigns(); render(); }
        if (state.route === 'profiles')  { state.lists.profiles.page = 1;  await fetchProfiles();  render(); }
      });

      [leadTypeWrap, hint, nameWrap, emailWrap, phoneWrap, regionWrap, langWrap,
       sectionHeader('Source Platform (how you found them)'),
       platWrap, usernameWrap, linkWrap, genreWrap, avgViewsWrap, followersWrap
      ].forEach(f => form.appendChild(f));

      if (prefill) {
        const setVal = (k, v) => { if (v != null && v !== '' && fields[k]) fields[k].value = String(v); };
        ['lead_type','name','email','phone','region','platform','username','link','genre','avg_views','followers'].forEach(k => setVal(k, prefill[k]));
        updateHint();
      }

      form.appendChild(el('div', { class: 'flex justify-end gap-2 pt-3 mt-2 border-t border-stone-200' },
        el('button', { class: 'px-3 py-1.5 text-sm rounded-lg border border-stone-200 bg-white hover:bg-stone-50', onClick: () => modal.close() }, 'Cancel'),
        submitBtn
      ));
      const modal = renderModal('Add Influencer Profile + Platform', form);

    // ===============================================================
    // CSV HELPERS
    // ===============================================================
    function toCSV(rows, columns) {
      const esc = (v) => {
        if (v == null) return '';
        const s = String(v);
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      };
      const head = columns.map(c => esc(c.label)).join(',');
      const body = rows.map(r => columns.map(c => esc(typeof c.value === 'function' ? c.value(r) : r[c.value])).join(',')).join('\n');
      return head + '\n' + body;
    }
    function downloadCSV(filename, csv) {
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = el('a', { href: url, download: filename });
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
    function extractUtmCampaign(utmLink) {
      if (!utmLink) return '';
      try {
        return new URL(utmLink).searchParams.get('utm_campaign') || '';
      } catch {
        const m = utmLink.match(/utm_campaign=([^&#]+)/);
        return m ? decodeURIComponent(m[1]) : '';
      }
    }
    function parseCSV(text) {
      // Simple CSV parser supporting quoted fields with commas
      const rows = [];
      let row = [], val = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) {
          if (c === '"' && text[i+1] === '"') { val += '"'; i++; }
          else if (c === '"') inQ = false;
          else val += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === ',') { row.push(val); val = ''; }
          else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(val); rows.push(row); row = []; val = ''; }
          else val += c;
        }
      }
      if (val !== '' || row.length) { row.push(val); rows.push(row); }
      return rows.filter(r => r.some(x => x !== ''));
    }

    // ===============================================================
    // REPORTS (admin)
    // ===============================================================
    const reportsState = { from: null, to: null, data: null, targets: null };
    async function fetchReports() {
      if (!reportsState.from) {
        const t = new Date(); const f = new Date(t); f.setDate(f.getDate() - 29);
        reportsState.to = t.toISOString().slice(0, 10);
        reportsState.from = f.toISOString().slice(0, 10);
      }
      const rangeStart = reportsState.from;
      const rangeEnd = reportsState.to + 'T23:59:59';
      const [{ data: d, error: e1 }, { data: tg, error: e2 }, { data: rawScouts, error: e3 }, { data: rawFollowups, error: e4 }, { data: admins, error: e5 }, { data: rawGoneLive, error: e6 }] = await Promise.all([
        supabase.rpc('reports_data', { d_from: reportsState.from, d_to: reportsState.to }),
        supabase.rpc('reachout_target_report', { d_from: reportsState.from, d_to: reportsState.to }),
        supabase.from('platforms').select('created_at').gte('created_at', rangeStart).lte('created_at', rangeEnd),
        supabase.from('campaign_activities').select('created_at').gte('created_at', rangeStart).lte('created_at', rangeEnd),
        supabase.from('team_members').select('user_id').eq('role', 'admin'),
        supabase.from('campaigns').select('gone_live_date, owner:team_members!campaigns_owner_id_fkey ( full_name )')
          .not('gone_live_date', 'is', null).gte('gone_live_date', reportsState.from).lte('gone_live_date', reportsState.to),
      ]);
      if (e1) { toast(e1.message, 'error'); return; }
      if (e2) { toast(e2.message, 'error'); }
      reportsState.data = d;
      // Admins don't carry a reachout target — exclude them from the Target vs Achieved report entirely
      const adminIds = new Set((admins || []).map(a => a.user_id));
      reportsState.targets = tg ? { ...tg, summary: (tg.summary || []).filter(u => !adminIds.has(u.user_id)) } : tg;
      // The RPC's own hourly bucketing has a known bug (correlated subquery mismatches hours across
      // different days), so recompute hourly counts here directly from raw rows instead of trusting d.hourly.
      if (!e3 && !e4) {
        const newByHr = Array(24).fill(0), fuByHr = Array(24).fill(0);
        (rawScouts || []).forEach(r => newByHr[new Date(r.created_at).getHours()]++);
        (rawFollowups || []).forEach(r => fuByHr[new Date(r.created_at).getHours()]++);
        reportsState.hourly = Array.from({ length: 24 }, (_, hr) => ({ hr, new_count: newByHr[hr], fu_count: fuByHr[hr] }));
      } else {
        reportsState.hourly = d?.hourly || [];
      }
      // Gone Live count, day-wise, stacked by owner
      if (!e6) {
        const byDayOwner = {};
        const owners = new Set();
        (rawGoneLive || []).forEach(r => {
          const day = r.gone_live_date;
          const owner = r.owner?.full_name || 'Unassigned';
          owners.add(owner);
          byDayOwner[day] = byDayOwner[day] || {};
          byDayOwner[day][owner] = (byDayOwner[day][owner] || 0) + 1;
        });
        const days = Object.keys(byDayOwner).sort();
        reportsState.goneLive = { days, owners: Array.from(owners).sort(), byDayOwner };
      } else {
        reportsState.goneLive = { days: [], owners: [], byDayOwner: {} };
      }
    }

            options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, ticks: { precision: 0 } } }, plugins: { legend: { position: 'bottom' } } }
          });
        }
      }, 0);

      // Reach-out targets — target vs achieved by day & owner (Sunday excluded)
      const tg = reportsState.targets;
      const targetCard = tg ? (() => {
        const matrixByUserDay = {};
        (tg.matrix || []).forEach(m => { matrixByUserDay[`${m.user_id}|${m.d}`] = m; });
        const cellColor = (achieved, target) => {
          if (!target) return 'bg-stone-50 text-stone-400';
          const pct = (achieved / target) * 100;
          if (pct >= 100) return 'bg-emerald-50 text-emerald-800';
          if (pct >= 50)  return 'bg-amber-50 text-amber-800';
          return 'bg-rose-50 text-rose-700';
        };
        const dayLabel = (d) => {
          const dt = new Date(d);
          return `${dt.getDate()}/${dt.getMonth()+1}`;
        };
        const weekday = (d) => ['Su','Mo','Tu','We','Th','Fr','Sa'][new Date(d).getDay()];
        return el('div', { class: 'bg-white border border-stone-200 rounded-xl overflow-hidden mb-4' },
          el('div', { class: 'px-4 py-2 border-b border-stone-200 bg-stone-50 flex items-center justify-between' },
            el('div', { class: 'text-sm font-semibold' }, 'Reach-out targets · Target vs Achieved'),
            el('div', { class: 'text-[11px] text-stone-500' }, 'Sundays excluded · New scouts only')
          ),
          el('div', { class: 'overflow-x-auto' },
            el('table', { class: 'w-full text-xs' },
              el('thead', {},
                el('tr', { class: 'bg-stone-50 text-stone-500 uppercase text-[10px]' },
                  el('th', { class: 'px-2 py-1.5 text-left sticky left-0 bg-stone-50' }, 'Agent'),
                  el('th', { class: 'px-2 py-1.5 text-right' }, 'Target/day'),
                  ...(tg.days || []).map(d => el('th', { class: 'px-1.5 py-1.5 text-center' },
                    el('div', { class: 'text-[10px]' }, weekday(d)),
                    el('div', { class: 'font-normal' }, dayLabel(d))
                  )),
                  el('th', { class: 'px-2 py-1.5 text-right bg-stone-100' }, 'Total')
                )
              ),
              el('tbody', {},
                ...((tg.summary || []).map(u => {
                  const totalPct = u.total_target ? Math.round(100 * u.total_achieved / u.total_target) : 0;
                  const totalColor = !u.total_target ? 'text-stone-400' : totalPct >= 100 ? 'text-emerald-700 font-semibold' : totalPct >= 50 ? 'text-amber-700' : 'text-rose-600 font-semibold';
                  return el('tr', { class: 'border-b border-stone-100' },
                    el('td', { class: 'px-2 py-1.5 sticky left-0 bg-white font-medium' }, u.full_name || '—'),
                    el('td', { class: 'px-2 py-1.5 text-right text-stone-600' }, String(u.daily_target || 0)),
                    ...(tg.days || []).map(d => {
                      const cell = matrixByUserDay[`${u.user_id}|${d}`] || { achieved: 0, target: u.daily_target };
                      return el('td', { class: `px-1.5 py-1.5 text-center ${cellColor(cell.achieved, cell.target)}` },
                        u.daily_target ? `${cell.achieved}/${cell.target}` : String(cell.achieved)
                      );
                    }),
                    el('td', { class: `px-2 py-1.5 text-right bg-stone-50 ${totalColor}` },
                      `${u.total_achieved}/${u.total_target} (${totalPct}%)`
                    )
                  );
                })),
                (() => {
                  const summary = tg.summary || [];
                  const grandDailyTarget = summary.reduce((s, u) => s + (u.daily_target || 0), 0);
                  const grandAchieved = summary.reduce((s, u) => s + (u.total_achieved || 0), 0);
                  const grandTarget = summary.reduce((s, u) => s + (u.total_target || 0), 0);
                  const grandPct = grandTarget ? Math.round(100 * grandAchieved / grandTarget) : 0;
                  return el('tr', { class: 'bg-stone-50 font-semibold border-t-2 border-stone-200' },
                    el('td', { class: 'px-2 py-1.5 sticky left-0 bg-stone-50' }, 'Total'),
                    el('td', { class: 'px-2 py-1.5 text-right' }, String(grandDailyTarget)),
                    ...(tg.days || []).map(d => {
                      const dayAchieved = summary.reduce((s, u) => s + ((matrixByUserDay[`${u.user_id}|${d}`] || {}).achieved || 0), 0);
                      return el('td', { class: 'px-1.5 py-1.5 text-center' }, String(dayAchieved));
                    }),
                    el('td', { class: 'px-2 py-1.5 text-right bg-stone-100' }, `${grandAchieved}/${grandTarget} (${grandPct}%)`)
                  );
                })()
              )
            )
          )
        );
      })() : null;

      // Raw data export (admin only — Reports page itself is already admin-gated, this is an extra explicit check)
      // Definitions match reports_data RPC exactly: new scout = platforms row, follow-up = campaign_activities row
      const exportCard = state.me?.role === 'admin' ? el('div', { class: 'bg-white border border-stone-200 rounded-xl p-4 mb-4' },
        el('h3', { class: 'text-sm font-semibold mb-1' }, 'Export raw data'),
        el('p', { class: 'text-xs text-stone-500 mb-3' }, `For the selected date range (${reportsState.from} → ${reportsState.to}).`),
        el('div', { class: 'flex flex-wrap gap-2' },
          el('button', { class: 'px-3 py-1.5 text-sm rounded-lg bg-white border border-stone-200 hover:bg-stone-50 text-stone-700',
            onClick: async () => {
              const { data, error } = await supabase.from('platforms')
                .select(`created_at, platform, username, profile:profiles ( name, email, region ), agent:team_members!created_by ( full_name )`)
                .gte('created_at', reportsState.from).lte('created_at', reportsState.to + 'T23:59:59')
                .order('created_at', { ascending: false });
              if (error) return toast(error.message, 'error');
              if (!data || !data.length) return toast('No new scouts in this range', 'error');
              const rows = data.map(p => ({ date: p.created_at, agent: p.agent?.full_name || '', profile: p.profile?.name || '', email: p.profile?.email || '', geo: p.profile?.region || '', platform: p.platform || '', username: p.username || '' }));
              downloadCSV(`new-scouts_${reportsState.from}_to_${reportsState.to}.csv`,
                toCSV(rows, [
                  { label: 'Date', value: 'date' }, { label: 'Agent', value: 'agent' },
                  { label: 'Profile', value: 'profile' }, { label: 'Email', value: 'email' }, { label: 'Geo', value: 'geo' },
                  { label: 'Platform', value: 'platform' }, { label: 'Username', value: 'username' }
                ]));
            } }, '⬇ New scouts (raw)'),
          el('button', { class: 'px-3 py-1.5 text-sm rounded-lg bg-white border border-stone-200 hover:bg-stone-50 text-stone-700',
            onClick: async () => {
              const { data, error } = await supabase.from('campaign_activities')
                .select(`created_at, activity_type, note, campaign:campaigns ( name, platform:platforms ( profile:profiles ( email, region ) ) ), user:team_members!campaign_activities_user_id_fkey ( full_name )`)
                .gte('created_at', reportsState.from).lte('created_at', reportsState.to + 'T23:59:59')
                .order('created_at', { ascending: false });
              if (error) return toast(error.message, 'error');
              if (!data || !data.length) return toast('No follow-ups in this range', 'error');
              const rows = data.map(a => ({ date: a.created_at, agent: a.user?.full_name || '', campaign: a.campaign?.name || '', email: a.campaign?.platform?.profile?.email || '', geo: a.campaign?.platform?.profile?.region || '', type: a.activity_type, note: a.note || '' }));
              downloadCSV(`follow-ups_${reportsState.from}_to_${reportsState.to}.csv`,
                toCSV(rows, [
                  { label: 'Date', value: 'date' }, { label: 'Agent', value: 'agent' },
                  { label: 'Campaign', value: 'campaign' }, { label: 'Email', value: 'email' }, { label: 'Geo', value: 'geo' },
                  { label: 'Type', value: 'type' }, { label: 'Note', value: 'note' }
                ]));
            } }, '⬇ Follow-ups (raw)'),
          el('button', { class: 'px-3 py-1.5 text-sm rounded-lg bg-white border border-stone-200 hover:bg-stone-50 text-stone-700',
            onClick: () => {
              const rows = (reportsState.targets?.matrix || []).map(m => ({ user_id: m.user_id, date: m.d, achieved: m.achieved, target: m.target }));
              if (!rows.length) return toast('No target data in this range', 'error');
              downloadCSV(`reachout-targets_${reportsState.from}_to_${reportsState.to}.csv`,
                toCSV(rows, [
                  { label: 'User ID', value: 'user_id' }, { label: 'Date', value: 'date' },
                  { label: 'New scouts achieved', value: 'achieved' }, { label: 'Daily target', value: 'target' }
                ]));
            } }, '⬇ New scouts vs target (raw)'),
          el('button', { class: 'px-3 py-1.5 text-sm rounded-lg bg-white border border-stone-200 hover:bg-stone-50 text-stone-700',
            onClick: async () => {
              const { data, error } = await supabase.from('campaigns')
                .select('utm_link, spends_inr, gone_live_date')
                .not('gone_live_date', 'is', null)
                .gte('gone_live_date', reportsState.from).lte('gone_live_date', reportsState.to)
                .order('gone_live_date', { ascending: false });
              if (error) return toast(error.message, 'error');
              if (!data || !data.length) return toast('No Gone Live campaigns in this range', 'error');
              const rows = data
                .map(c => ({ utm_campaign: extractUtmCampaign(c.utm_link), spends: c.spends_inr, gone_live: c.gone_live_date }))
                .filter(r => r.utm_campaign);
              if (!rows.length) return toast('No campaigns with a usable UTM link in this range', 'error');
              downloadCSV(`utm-campaign-spends_${reportsState.from}_to_${reportsState.to}.csv`,
                toCSV(rows, [
                  { label: 'UTM Campaign', value: 'utm_campaign' },
                  { label: 'Spends (INR)', value: 'spends' },
                  { label: 'Gone Live Date', value: 'gone_live' }
                ]));
            } }, '⬇ UTM Campaign vs Spends (raw)')
        )
      ) : null;

      return el('div', {},
        pageHeader('Insights', 'Reports', 'Activity and performance over a custom date range', null),
        dateBar, exportCard, hourlyCard, goneLiveCard, targetCard, agentDaily, matrixCard, l2eCard, dropCard
      );
    }

    // ===============================================================
    // MY REACH-OUT (non-admins) — scoped personal view of the same
    // reachout_target_report RPC used in Reports, filtered client-side
    // to the signed-in user's own row. Admins already see everyone's
    // via Reports, so this route is hidden for them.
    // ===============================================================
    const myReachoutState = { from: null, to: null, data: null };
    async function fetchMyReachout() {
      if (!myReachoutState.from) {
        const t = new Date(); const f = new Date(t); f.setDate(f.getDate() - 29);
        myReachoutState.to = t.toISOString().slice(0, 10);
        myReachoutState.from = f.toISOString().slice(0, 10);
      }
      const { data, error } = await supabase.rpc('reachout_target_report', { d_from: myReachoutState.from, d_to: myReachoutState.to });
      if (error) { toast(error.message, 'error'); return; }
      myReachoutState.data = data;
    }

    function viewMyReachout() {
      const dateBar = el('div', { class: 'bg-white border border-stone-200 rounded-xl p-4 mb-4 flex flex-wrap items-center gap-3' },
        el('label', { class: 'text-xs text-stone-600' }, 'From ', el('input', { type: 'date', value: myReachoutState.from, class: 'ml-1 px-2 py-1 border border-stone-300 rounded',
          onchange: e => { myReachoutState.from = e.target.value; } })),
        el('label', { class: 'text-xs text-stone-600' }, 'To ', el('input', { type: 'date', value: myReachoutState.to, class: 'ml-1 px-2 py-1 border border-stone-300 rounded',
          onchange: e => { myReachoutState.to = e.target.value; } })),
        el('button', { class: 'px-3 py-1.5 text-sm rounded-lg btn-brand', onClick: async () => { await fetchMyReachout(); render(); } }, 'Apply')
      );

      const header = pageHeader('Performance', 'My Reach-out', 'Your daily new-scout target vs achieved · Sundays excluded', null);

      if (!myReachoutState.data) {
        return el('div', {}, header, dateBar, el('div', { class: 'text-center text-sm text-stone-500 py-10' }, 'Loading…'));
      }

      const tg = myReachoutState.data;
      const mine = (tg.summary || []).find(u => u.user_id === state.me.user_id);
      if (!mine) {
        return el('div', {}, header, dateBar,
          el('div', { class: 'bg-white border border-dashed border-stone-300 rounded-xl p-10 text-center text-sm text-stone-500' },
            'No daily target has been set for you yet — ask an admin on the Team page to set one.'
          )
        );
      }

      const myRows = {};
      (tg.matrix || []).filter(m => m.user_id === state.me.user_id).forEach(m => { myRows[m.d] = m; });

      const totalPct = mine.total_target ? Math.round(100 * mine.total_achieved / mine.total_target) : 0;
      const totalColor = !mine.total_target ? 'text-stone-400' : totalPct >= 100 ? 'text-emerald-700' : totalPct >= 50 ? 'text-amber-700' : 'text-rose-600';

      const kpis = el('div', { class: 'grid grid-cols-2 md:grid-cols-4 gap-3 mb-5' },
        kpiTile('Daily target', mine.daily_target || 0),
        kpiTile('Achieved (period)', mine.total_achieved || 0, 'text-emerald-700'),
        kpiTile('Target (period)', mine.total_target || 0),
        kpiTile('Completion', totalPct + '%', totalColor),
      );

      const dayLabel = (d) => { const dt = new Date(d); return `${dt.getDate()}/${dt.getMonth()+1}`; };
      const weekday = (d) => ['Su','Mo','Tu','We','Th','Fr','Sa'][new Date(d).getDay()];
      const cellColor = (achieved, target) => {
        if (!target) return 'bg-stone-50 text-stone-400';
        const pct = (achieved / target) * 100;
        if (pct >= 100) return 'bg-emerald-50 text-emerald-800';
        if (pct >= 50)  return 'bg-amber-50 text-amber-800';
        return 'bg-rose-50 text-rose-700';
      };

      const table = el('div', { class: 'bg-white border border-stone-200 rounded-xl overflow-hidden' },
        el('div', { class: 'px-4 py-2 border-b border-stone-200 bg-stone-50 text-sm font-semibold' }, 'Day-by-day'),
        el('div', { class: 'overflow-x-auto' },
          el('table', { class: 'w-full text-xs' },
            el('thead', {},
              el('tr', { class: 'bg-stone-50 text-stone-500 uppercase text-[10px]' },
                ...(tg.days || []).map(d => el('th', { class: 'px-2 py-1.5 text-center' },
                  el('div', { class: 'text-[10px]' }, weekday(d)),
                  el('div', { class: 'font-normal' }, dayLabel(d))
                ))
              )
            ),
            el('tbody', {},
              el('tr', {},
                ...(tg.days || []).map(d => {
                  const cell = myRows[d] || { achieved: 0, target: mine.daily_target };
                  return el('td', { class: `px-2 py-2 text-center ${cellColor(cell.achieved, cell.target)}` },
                    mine.daily_target ? `${cell.achieved}/${cell.target}` : String(cell.achieved)
                  );
                })
              )
            )
          )
        )
      );

      return el('div', {}, header, dateBar, kpis, table);
    }

    // ===============================================================
    // TEAM (admin)
    // ===============================================================
    const teamState = { members: [], pocs: [] };
    async function fetchTeam() {
      const [{ data, error }, { data: pocs }] = await Promise.all([
        supabase.from('team_members').select(`
          *, team_lead:team_lead_id ( full_name ), target:user_targets!user_targets_user_id_fkey ( daily_target )
        `).order('created_at', { ascending: true }),
        supabase.rpc('imported_poc_summary'),
      ]);
      if (error) { toast(error.message, 'error'); return; }
      teamState.members = data || [];
      teamState.pocs = pocs || [];
    }

    function viewTeam() {
      const m = teamState.members;
      const tls = m.filter(x => x.role === 'tl' && x.is_active);

      const updateRole = async (uid, newRole) => {
        const { error } = await supabase.from('team_members').update({ role: newRole }).eq('user_id', uid);
        if (error) return toast(error.message, 'error');
        await fetchTeam(); render(); toast('Role updated', 'success');
      };
      const updateTL = async (uid, tlId) => {
        const { error } = await supabase.from('team_members').update({ team_lead_id: tlId || null }).eq('user_id', uid);
        if (error) return toast(error.message, 'error');
        await fetchTeam(); render(); toast('Team lead updated', 'success');
      };
      const updateActive = async (uid, isActive) => {
        const { error } = await supabase.from('team_members').update({ is_active: isActive }).eq('user_id', uid);
        if (error) return toast(error.message, 'error');
        await fetchTeam(); render(); toast('Status updated', 'success');
      };

      const updateTarget = async (uid, target) => {
        const t = parseInt(target) || 0;
        // upsert via merge on PK
        const { error } = await supabase.from('user_targets')
          .upsert({ user_id: uid, daily_target: t, updated_by: state.me.user_id }, { onConflict: 'user_id' });
        if (error) return toast(error.message, 'error');
        await fetchTeam();
        toast('Daily target updated', 'success');
      };

      const openBulkReassign = (member) => {
        const otherMembers = m.filter(x => x.user_id !== member.user_id && x.is_active);
        if (!otherMembers.length) return toast('No other active members to reassign to', 'error');

        const targetSel = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-200 rounded-lg focus:outline-none focus:border-stone-400' },
          el('option', { value: '' }, '— Pick a team member —'),
          ...otherMembers.map(x => el('option', { value: x.user_id }, `${x.full_name || x.email} (${x.role})`))
        );

        const countEl = el('span', { class: 'font-semibold' }, '…');
        // Fetch active campaign count for the source member
        supabase.from('campaigns').select('id', { count: 'exact', head: true })
          .eq('owner_id', member.user_id)
          .not('group_status', 'in', '("Dropped","Post Gone Live")')
          .then(({ count }) => { countEl.textContent = String(count || 0); });

        const submitBtn = el('button', { class: 'px-3 py-1.5 text-sm rounded-lg btn-brand' }, 'Reassign all');
        submitBtn.addEventListener('click', async () => {
          if (!targetSel.value) return toast('Pick a target team member', 'error');
          if (!confirm(`Move all active campaigns from ${member.full_name || member.email} to the selected member?`)) return;
          submitBtn.disabled = true; submitBtn.textContent = 'Reassigning…';
          const { error, count } = await supabase.from('campaigns')
            .update({ owner_id: targetSel.value }, { count: 'exact' })
            .eq('owner_id', member.user_id)
            .not('group_status', 'in', '("Dropped","Post Gone Live")');
          submitBtn.disabled = false; submitBtn.textContent = 'Reassign all';
          if (error) return toast(error.message, 'error');
          modal.close();
          toast(`Reassigned ${count || 0} active campaigns`, 'success');
          await fetchTeam(); render();
        });

        const wrap = el('div', { class: 'space-y-3' },
          el('p', { class: 'text-sm text-stone-600' }, 'Moving active (non-terminal) campaigns from ',
            el('span', { class: 'font-semibold' }, member.full_name || member.email),
            ' (', countEl, ' campaigns)'
          ),
          el('label', { class: 'block' },
            el('span', { class: 'text-xs font-medium text-stone-600' }, 'Reassign to *'),
            targetSel
          ),
          el('p', { class: 'text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1.5' },
            'This only moves Open/Active campaigns. Dropped & Post Gone Live ones stay with the original owner for historical accuracy.'
          ),
          el('div', { class: 'flex justify-end gap-2 pt-3 mt-2 border-t border-stone-200' },
            el('button', { class: 'px-3 py-1.5 text-sm rounded-lg border border-stone-200 bg-white hover:bg-stone-50', onClick: () => modal.close() }, 'Cancel'),
            submitBtn
          )
        );
        const modal = renderModal(`Reassign campaigns from ${member.full_name || member.email}`, wrap);
      };

      const migratePOC = async (poc, targetUserId, targetName) => {
        if (!targetUserId) return toast('Pick a team member', 'error');
        if (!confirm(`Migrate all records tagged "${poc}" to ${targetName}? This will transfer ownership of profiles, platforms, and campaigns.`)) return;
        const { data, error } = await supabase.rpc('migrate_poc', { poc_name: poc, target_user: targetUserId });
        if (error) return toast(error.message, 'error');
        toast(`Migrated: ${data.profiles} profiles · ${data.platforms} platforms · ${data.campaigns} campaigns`, 'success');
        await fetchTeam(); render();
      };

      const pocSection = teamState.pocs.length ? el('div', { class: 'bg-white border border-stone-200 rounded-xl overflow-hidden mb-4' },
        el('div', { class: 'px-4 py-2.5 border-b border-stone-200 bg-amber-50 flex items-center justify-between' },
          el('div', {},
            el('div', { class: 'text-sm font-semibold text-amber-900' }, 'POC Migration'),
            el('div', { class: 'text-[11px] text-amber-700 mt-0.5' }, `${teamState.pocs.length} POC names from the initial import need to be mapped to real accounts`)
          )
        ),
        el('div', { class: 'overflow-x-auto' },
          el('table', { class: 'w-full text-sm' },
            el('thead', { class: 'bg-stone-50 text-[11px] uppercase text-stone-500' },
              el('tr', {},
                el('th', { class: 'px-3 py-2 text-left' }, 'Imported POC'),
                el('th', { class: 'px-3 py-2 text-right' }, 'Profiles'),
                el('th', { class: 'px-3 py-2 text-right' }, 'Platforms'),
                el('th', { class: 'px-3 py-2 text-right' }, 'Campaigns'),
                el('th', { class: 'px-3 py-2 text-left' }, 'Assign to team member'),
                el('th', { class: 'px-3 py-2 text-right' }, '')
              )
            ),
            el('tbody', {},
              ...teamState.pocs.map(p => {
                const sel = el('select', { class: 'px-2 py-1 text-sm border border-stone-200 rounded w-full max-w-[220px]' },
                  el('option', { value: '' }, '— Pick a signed-in member —'),
                  ...m.filter(x => x.is_active).map(x => el('option', { value: x.user_id, 'data-name': x.full_name || x.email }, x.full_name || x.email))
                );
                return el('tr', { class: 'border-b border-stone-100' },
                  el('td', { class: 'px-3 py-2 font-medium' }, p.poc),
                  el('td', { class: 'px-3 py-2 text-right' }, String(p.profiles)),
                  el('td', { class: 'px-3 py-2 text-right' }, String(p.platforms)),
                  el('td', { class: 'px-3 py-2 text-right' }, String(p.campaigns)),
                  el('td', { class: 'px-3 py-2' }, sel),
                  el('td', { class: 'px-3 py-2 text-right' },
                    el('button', { class: 'px-2 py-1 text-xs rounded-lg btn-brand',
                      onClick: () => {
                        const opt = sel.options[sel.selectedIndex];
                        migratePOC(p.poc, sel.value, opt.getAttribute('data-name') || opt.textContent);
                      } }, 'Migrate')
                  )
                );
              })
            )
          )
        )
      ) : null;

      return el('div', {},
        pageHeader('Administration', 'Team', `${m.length} members · manage roles and team leads`, null),
        el('div', { class: 'bg-blue-50 border border-blue-200 rounded-xl p-3 mb-4 text-xs text-blue-900' },
          'Team members appear here after they sign in via Google for the first time. Then you can promote them to TL or admin, assign team leads, or deactivate.'
        ),
        pocSection,
        el('div', { class: 'bg-white border border-stone-200 rounded-xl overflow-hidden' },
          el('div', { class: 'overflow-x-auto' },
            el('table', { class: 'w-full text-sm' },

    function openImportCSVModal() {
      const sampleHeaders = ['lead_type','name','email','phone','region','languages','platform','username','link','genre','avg_views','followers'];
      const fileInp = el('input', { type: 'file', accept: '.csv', class: 'w-full text-xs' });
      const summary = el('div', { class: 'text-xs text-stone-600 space-y-1' });
      const submitBtn = el('button', { class: 'px-3 py-1.5 text-sm rounded-lg btn-brand', disabled: true }, 'Import');

      let parsed = null;
      fileInp.addEventListener('change', () => {
        const f = fileInp.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          const rows = parseCSV(r.result);
          if (!rows.length) { summary.innerHTML = 'Empty CSV'; return; }
          const headers = rows[0].map(h => h.trim().toLowerCase());
          const body = rows.slice(1);
          parsed = { headers, body };
          summary.innerHTML = `Found <b>${body.length}</b> rows. Columns: ${headers.join(', ')}`;
          submitBtn.disabled = false;
        };
        r.readAsText(f);
      });

      submitBtn.addEventListener('click', async () => {
        if (!parsed) return;
        submitBtn.disabled = true; submitBtn.textContent = 'Importing…';
        const { headers, body } = parsed;
        const idx = (n) => headers.indexOf(n);
        let ok = 0, fail = 0, errs = [];
        for (const row of body) {
          const get = (n) => idx(n) >= 0 ? row[idx(n)]?.trim() : '';
          const profilePayload = {
            lead_type: get('lead_type') || 'DM',
            name:      get('name'),
            email:     get('email') || null,
            phone:     get('phone') || null,
            region:    get('region') || null,
            languages: get('languages') ? get('languages').split(';').map(s => s.trim()).filter(Boolean) : null,
            created_by: state.me.user_id,
          };
          const platformPayload = {
            platform:   get('platform'),
            username:   get('username'),
            link:       get('link') || null,
            genre:      get('genre') || null,
            avg_views:  get('avg_views') ? parseInt(get('avg_views')) : null,
            followers:  get('followers') ? parseInt(get('followers')) : null,
            created_by: state.me.user_id,
          };
          if (!profilePayload.name || !platformPayload.platform || !platformPayload.username) {
            fail++; errs.push(`Missing required fields: ${profilePayload.name || '?'}`); continue;
          }
          const { data: p, error: pe } = await supabase.from('profiles').insert(profilePayload).select().single();
          if (pe) { fail++; errs.push(`${profilePayload.name}: ${pe.message}`); continue; }
          platformPayload.profile_id = p.id;
          const { error: ple } = await supabase.from('platforms').insert(platformPayload);
          if (ple) {
            await supabase.from('profiles').delete().eq('id', p.id);
            fail++; errs.push(`${profilePayload.name}: ${ple.message}`); continue;
          }
          ok++;
        }
        modal.close();
        toast(`Imported ${ok}, failed ${fail}`, fail ? 'error' : 'success');
        if (errs.length) console.warn('Import errors:', errs);
        if (state.route === 'campaigns') { await fetchCampaigns(); render(); }
      });

      const wrap = el('div', { class: 'space-y-3' },
        el('p', { class: 'text-xs text-stone-600' }, 'CSV columns expected (case-insensitive). Languages can be semicolon-separated. Required: name, platform, username.'),
        el('p', { class: 'text-[11px] font-mono bg-stone-100 px-2 py-1 rounded break-all' }, sampleHeaders.join(',')),
        fileInp,
        summary,
        el('div', { class: 'flex justify-end gap-2 pt-2' },
          el('button', { class: 'px-3 py-1.5 text-sm rounded-lg border border-stone-200 bg-white hover:bg-stone-50', onClick: () => modal.close() }, 'Cancel'),
          submitBtn
        )
      );
      const modal = renderModal('Import CSV', wrap);
    }
