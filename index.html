    function discSyncControls() {
      const run = document.getElementById('disc-run'), stop = document.getElementById('disc-stop'), csv = document.getElementById('disc-csv');
      if (run) { run.disabled = DISC.running; run.textContent = DISC.running ? 'Searching…' : 'Find channels'; }
      if (stop) stop.disabled = !DISC.running;
      if (csv) csv.disabled = !DISC.results.length;
    }

    // Parse pasted channel links / @handles / channel IDs
    function discParseImport(text) {
      const ids = new Set(), handles = new Set();
      String(text || '').split(/[\s,;]+/).map(x => x.trim()).filter(Boolean).forEach(x => {
        const id = /(UC[\w-]{22})/.exec(x);
        if (id) { ids.add(id[1]); return; }
        const h = /youtube\.com\/@([^/?#\s]+)/i.exec(x) || /^@([\w.\-]+)$/.exec(x);
        if (h) handles.add('@' + decodeURIComponent(h[1]));
      });
      return { ids: [...ids], handles: [...handles] };
    }

    async function runDiscover(opts = {}) {
      if (DISC.running) return;
      if (!ytGetKey()) return discSetStatus('The YouTube API key is not set up yet. Ask an admin to add it to the CRM code (YT_API_KEY).', true);
      const f = DISC.form;
      const importing = !!opts.import;
      const terms = importing ? [] : f.terms.split('\n').map(s => s.trim()).filter(Boolean);
      if (!importing && !terms.length) return discSetStatus('Enter at least one search term.', true);
      const imp = importing ? discParseImport(f.importText) : null;
      if (importing && !imp.ids.length && !imp.handles.length) return discSetStatus('Paste YouTube channel links or @handles, one per line.', true);
      const perTerm = +f.perTerm || 50;
      // Imported channels are ones you already chose, so the size / activity filters don't apply
      const minSubs = importing ? 0 : (+f.minSubs || 0);
      const maxSubs = importing ? Infinity : (f.maxSubs ? +f.maxSubs : Infinity);
      const activeDays = importing ? 0 : (+f.activeDays || 0);

      DISC.running = true; DISC.stop = false; DISC.quota = 0; DISC.results = []; DISC.cacheHits = 0;
      discSyncControls(); discRenderResults(); discSetProgress(2);

      try {
        if (!DISC.crmKeys) await loadDiscoverCrm();

        const found = new Map();
        if (importing) {
          // 1a. Pasted list: resolve @handles to channel IDs (1 unit each)
          imp.ids.forEach(id => found.set(id, new Set(['pasted list'])));
          for (let i = 0; i < imp.handles.length && !DISC.stop; i++) {
            discSetStatus(`Looking up ${imp.handles[i]}… (${i + 1} / ${imp.handles.length})`);
            try {
              const d = await ytCall('channels', { part: 'id', forHandle: imp.handles[i] }, 1);
              const id = d.items?.[0]?.id;
              if (id) found.set(id, new Set(['pasted list']));
            } catch (e) { if (e.fatal) throw e; }
            discSetProgress(5 + 20 * (i + 1) / imp.handles.length);
          }
        } else {
          // 1b. Search each term. Video search finds creators through what their videos are about;
          // channel search only matches words in channel names.
          const types = f.searchType === 'both' ? ['video', 'channel'] : [f.searchType === 'channel' ? 'channel' : 'video'];
          const steps = terms.length * types.length; let step = 0;
          for (let t = 0; t < terms.length && !DISC.stop; t++) {
            for (const type of types) {
              let pageToken = '', got = 0;
              while (got < perTerm && !DISC.stop) {
                discSetStatus(`Searching ${type === 'video' ? 'videos' : 'channel names'} for “${terms[t]}”… (${found.size} channels so far)`);
                const params = { part: 'snippet', type, q: terms[t], maxResults: Math.min(50, perTerm - got) };
                if (f.region) params.regionCode = f.region;
                if (f.lang) params.relevanceLanguage = f.lang;
                if (pageToken) params.pageToken = pageToken;
                const data = await ytSearchCached(params);
                for (const it of data.items || []) {
                  const id = it.snippet?.channelId || it.id?.channelId;
                  if (!id) continue;
                  if (!found.has(id)) found.set(id, new Set());
                  found.get(id).add(terms[t]);
                }
                got += (data.items || []).length;
                pageToken = data.nextPageToken;
                if (!pageToken || !(data.items || []).length) break;
              }
              step++;
              discSetProgress(5 + 20 * step / steps);
            }
            discFlushUsage();
          }
        }

        // 2. Channel details (50 per call)
        const ids = [...found.keys()];
        let channels = [];
        for (let i = 0; i < ids.length && !DISC.stop; i += 50) {
          discSetStatus(`Loading channel details… ${Math.min(i + 50, ids.length)} / ${ids.length}`);
          const data = await ytCall('channels', { part: 'snippet,statistics,contentDetails,brandingSettings,topicDetails,status', id: ids.slice(i, i + 50).join(','), maxResults: 50 }, 1);
          channels.push(...(data.items || []));
          discSetProgress(25 + 10 * Math.min(1, (i + 50) / ids.length));
        }
        channels = channels.filter(c => {
          const subs = +c.statistics?.subscriberCount || 0;
          if (c.statistics?.hiddenSubscriberCount) return minSubs === 0;
          if (subs < minSubs || subs > maxSubs) return false;
          if (!importing && f.countryOnly && f.region && (c.snippet?.country || '') !== f.region) return false;
          return true;
        });

        // 3. Latest uploads + stats per channel
        let done = 0;
        const cutoff = activeDays ? Date.now() - activeDays * 86400000 : 0;
        await ytPool(channels, 5, async (c) => {
          try {
            const uploads = c.contentDetails?.relatedPlaylists?.uploads;
            if (!uploads) return;
            const pl = await ytCall('playlistItems', { part: 'contentDetails', playlistId: uploads, maxResults: f.longOnly ? 30 : 10 }, 1);
            const vids = (pl.items || []).map(v => v.contentDetails.videoId);
            if (!vids.length) return;
            const vd = await ytCall('videos', { part: 'statistics,contentDetails,snippet,status', id: vids.join(','), maxResults: 50 }, 1);
            const videos = (vd.items || [])
              .filter(v => v.snippet?.liveBroadcastContent === 'none')
              .map(v => ({
                published: v.snippet.publishedAt,
                secs: ytParseDuration(v.contentDetails?.duration),
                views: +v.statistics?.viewCount || 0,
                likes: +v.statistics?.likeCount || 0,
                comments: +v.statistics?.commentCount || 0,
                desc: v.snippet?.description || '',
                title: v.snippet?.title || '',
                id: v.id,
                lang: v.snippet?.defaultAudioLanguage || v.snippet?.defaultLanguage || '',
                kids: !!v.status?.madeForKids,
              }))
              .sort((a, b) => new Date(b.published) - new Date(a.published));

            const lastUpload = videos[0]?.published || null;
            if (cutoff && (!lastUpload || new Date(lastUpload).getTime() < cutoff)) return;

            const longVids = f.longOnly ? videos.filter(v => v.secs > 180) : videos;
            const shortsFallback = f.longOnly && !longVids.length && videos.length > 0;   // channel posts only Shorts
            const recent = (shortsFallback ? videos : longVids).slice(0, 7);
            const last3 = recent.slice(0, 3);
            const avgOf = (arr) => arr.length ? Math.round(arr.reduce((a, v) => a + v.views, 0) / arr.length) : null;
            const v7 = recent.reduce((a, v) => a + v.views, 0);
            const e7 = recent.reduce((a, v) => a + v.likes + v.comments, 0);

            // Insights (all from data already loaded; no extra quota)
            const sortedViews = recent.map(v => v.views).sort((a, b) => a - b);
            const median7 = sortedViews.length
              ? (sortedViews.length % 2 ? sortedViews[(sortedViews.length - 1) / 2]
                 : Math.round((sortedViews[sortedViews.length / 2 - 1] + sortedViews[sortedViews.length / 2]) / 2))
              : null;
            const avg7v = avgOf(recent);
            const spiky = recent.length >= 3 && median7 != null && avg7v > 1.8 * Math.max(1, median7);
            const avgLikes = recent.length ? Math.round(recent.reduce((a, v) => a + v.likes, 0) / recent.length) : null;
            const avgComments = recent.length ? Math.round(recent.reduce((a, v) => a + v.comments, 0) / recent.length) : null;
            const avgLenSecs = recent.length ? Math.round(recent.reduce((a, v) => a + v.secs, 0) / recent.length) : null;
            let uploadsPerMonth = null;
            if (videos.length >= 2) {
              const spanDays = (new Date(videos[0].published) - new Date(videos[videos.length - 1].published)) / 86400000;
              uploadsPerMonth = spanDays > 0 ? +Math.min(99, (videos.length - 1) / spanDays * 30).toFixed(1) : null;
            }
            const best = recent.reduce((b, v) => (!b || v.views > b.views) ? v : b, null);
            const langCounts = {};
            videos.forEach(v => { const n = discLangName(v.lang); if (n) langCounts[n] = (langCounts[n] || 0) + 1; });
            const language = Object.entries(langCounts).sort((a, b) => b[1] - a[1])[0]?.[0]
              || discLangName(c.brandingSettings?.channel?.defaultLanguage || c.snippet?.defaultLanguage);
            const madeForKids = !!c.status?.madeForKids || (videos.length > 0 && videos.filter(v => v.kids).length / videos.length >= 0.5);

            const sn = c.snippet || {};
            const desc = sn.description || '';
            const chan = ytExtractContacts(desc + ' ' + (c.brandingSettings?.channel?.keywords || ''));
            const vidc = ytExtractContacts(videos.map(v => v.desc).join('\n'));
            const vidOnly = vidc.emails.filter(e => !chan.emails.includes(e));
            const emailSource = chan.emails.length ? (vidOnly.length ? 'channel + videos' : 'channel description') : (vidOnly.length ? 'video descriptions' : '');
            const handle = sn.customUrl || '';
            const locWordsNow = (f.locWords && f.locWords.length) ? f.locWords
              : (f.location ? [f.location.trim().toLowerCase()] : []);
            let locHit = null;
            if (locWordsNow.length) {
              const hay = [sn.title, sn.description, c.brandingSettings?.channel?.keywords, ...videos.slice(0, 15).map(v => v.title + ' ' + v.desc)]
                .join(' ').toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
              locHit = locWordsNow.some(w => {
                const clean = w.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').trim().replace(/\s+/g, '\\s+');
                return clean && new RegExp('(?:^|\\s)' + clean + '(?=\\s|$)').test(hay);
              });
            }
            const ind = discIndianSignals({
              texts: [sn.title, sn.description, c.brandingSettings?.channel?.keywords || '', ...videos.slice(0, 15).map(v => v.title + ' ' + v.desc.slice(0, 600))],
              videoLangs: videos.map(v => v.lang),
              country: sn.country || '',
            });
            const g = discDetectGenre({
              title: sn.title, description: desc,
              keywords: c.brandingSettings?.channel?.keywords || '',
              videoTitles: videos.slice(0, 15).map(v => v.title),
              topics: c.topicDetails?.topicCategories || [],
            });

            DISC.results.push({
              id: c.id,
              title: sn.title || '',
              genre: g.genre,
              genreAlso: g.also,
              handle,
              link: handle ? `https://www.youtube.com/${handle}` : `https://www.youtube.com/channel/${c.id}`,
              thumb: sn.thumbnails?.default?.url || '',
              subs: c.statistics?.hiddenSubscriberCount ? null : (+c.statistics?.subscriberCount || 0),
              totalViews: +c.statistics?.viewCount || 0,
              videoCount: +c.statistics?.videoCount || 0,
              country: sn.country || '',
              joined: sn.publishedAt || '',
              description: desc,
              emails: [...chan.emails, ...vidOnly],
              emailSource,
              instagram: [...new Set([...chan.instagram, ...vidc.instagram])],
              bio: [...new Set([...chan.bio, ...vidc.bio])],
              avg3: avgOf(last3),
              avg7: avgOf(recent),
              n7: recent.length,
              er7: v7 ? +(100 * e7 / v7).toFixed(2) : null,
              uploads30: videos.filter(v => Date.now() - new Date(v.published) < 30 * 86400000).length,
              shortsShare: videos.length ? videos.filter(v => v.secs <= 180).length / videos.length : 0,
              lastUpload,
              terms: [...(found.get(c.id) || [])],
              crmProfileId: null,
              shortsFallback,
              locHit, locLabel: f.location || '',
              indian: ind.indian, indianWhy: ind.reasons.join('; '),
              median7, spiky, avgLikes, avgComments, avgLenSecs, uploadsPerMonth, language, madeForKids,
              viewsToSubs: (avg7v != null && c.statistics?.subscriberCount > 0 && !c.statistics?.hiddenSubscriberCount)
                ? +(100 * avg7v / +c.statistics.subscriberCount).toFixed(1) : null,
              best: best ? { title: best.title, views: best.views, url: `https://www.youtube.com/watch?v=${best.id}` } : null,
            });
          } catch (e) {
            if (e.fatal) { DISC.stop = true; discSetStatus(e.message, true); }
          } finally {
            done++;
            discSetProgress(35 + 60 * done / Math.max(1, channels.length));
            if (done % 5 === 0 || done === channels.length) {
              if (!DISC.statusErr) discSetStatus(`Checking recent videos… ${done} / ${channels.length}`);
              discMarkCrm(); discRenderResults();
            }
          }
        });

        await loadDiscoverCrmEmails();
        discMarkCrm();
        discSetProgress(100);
        if (!DISC.statusErr) discSetStatus(`${DISC.stop ? 'Stopped. ' : ''}${DISC.results.length} channels ready. About ${ytNum(DISC.quota)} of your 10,000 daily API units used` +
          (DISC.cacheHits ? ` (${DISC.cacheHits} search${DISC.cacheHits > 1 ? 'es' : ''} reused from saved results for free).` : '.'));
      } catch (e) {
        discSetStatus(e.message, true);
      } finally {
        await discFlushUsage();
        DISC.running = false;
        discSyncControls();
        discRenderResults();
      }
    }

    // Why is a channel hidden? Returns a short reason key, or '' if it is shown.
    function discHideReason(r, q = DISC.filter.trim().toLowerCase()) {
      if (DISC.basedOnly) { const b = discBased(r); if (b === 'no' || b === 'unknown') return 'based'; }
      if (DISC.indianOnly && !r.indian) return 'indian';
      if (DISC.genre === '__none' && r.genre) return 'genre';
      if (DISC.genre && DISC.genre !== '__none' && r.genre !== DISC.genre && !r.genreAlso.includes(DISC.genre)) return 'genre';
      if (DISC.hideKids && r.madeForKids) return 'kids';
      if (DISC.hideCrm && r.crmProfileId) return 'crm';
      if (DISC.emailOnly && !r.emails.length) return 'email';
      if (DISC.locOnly && r.locHit === false) return 'loc';
      if (q && !(`${r.title} ${r.handle} ${r.description}`.toLowerCase().includes(q))) return 'text';
      return '';
    }

    function discHiddenSummary(shown) {
      const counts = {};
      DISC.results.forEach(r => { const k = discHideReason(r); if (k) counts[k] = (counts[k] || 0) + 1; });
      const region = discCountryName(DISC.form.region);
      const labels = {
        based: `not based in ${region || 'the region'}`, indian: 'not Indian creators', genre: `genre isn't ${DISC.genre === '__none' ? 'blank' : DISC.genre}`,
        kids: 'made for kids', crm: 'already in CRM', email: 'no email', loc: 'don’t mention the location', text: 'don’t match the filter text',
      };
      const parts = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${n} ${labels[k]}`);
      let tip = '';
      if (DISC.results.length && shown < 5) {
        if (+DISC.form.perTerm < 25) tip = 'Tip: set “Channels per search term” to 50. It costs about the same and finds up to 5× more channels.';
        else if (DISC.genre && counts.genre) tip = 'Tip: set the genre filter to “All genres”. Families abroad are often tagged Lifestyle or Travel.';
        else if (+DISC.form.minSubs > 1000) tip = 'Tip: lower “Min subscribers”. Many creators abroad are small.';
      }
      return { text: parts.length ? `Hidden by filters: ${parts.join(' · ')}` : '', tip };
    }

    function discVisible() {
      const q = DISC.filter.trim().toLowerCase();
      const k = DISC.sortKey, d = DISC.sortDir;
      return DISC.results.filter(r => !discHideReason(r, q)).sort((a, b) => {
        const x = a[k], y = b[k];
        if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
        if (k === 'lastUpload') return d * (new Date(x) - new Date(y));
        return typeof x === 'string' ? d * x.localeCompare(y) : d * (x - y);
      });
    }

    function discAddToCrm(r) {
      const email = r.emails[0] || '';
      openAddProfileModal({
        prefill: {
          lead_type: email ? 'Email' : 'DM',
          name: r.title,
          email,
          region: YT_COUNTRY_NAMES[r.country] || '',
          platform: 'Youtube',
          username: r.handle || r.title,
          link: r.link,
          genre: r.genre || '',
          avg_views: r.avg7 ?? '',
          followers: r.subs ?? '',
        },
        onSaved: (prof) => {
          r.crmProfileId = prof?.id || true;
          r.crmMatch = 'added';
          if (DISC.crmKeys) {
            if (r.handle) DISC.crmKeys.set(discNormHandle(r.handle), prof?.id);
            DISC.crmKeys.set(r.id.toLowerCase(), prof?.id);
          }
          discRenderResults();
        },
      });
    }

    function discDownloadCsv() {
      const cols = [
        ['Channel name', 'title'], ['Genre', 'genre'], ['Other genres', r => (r.genreAlso || []).join('; ')], ['Channel link', 'link'], ['Handle', 'handle'], ['Channel ID', 'id'],
        ['Subscribers', 'subs'], ['Avg views last 3', 'avg3'], ['Avg views last 7', 'avg7'], ['Videos used for avg', 'n7'], ['Median views last 7', 'median7'],
        ['One video inflating avg', r => r.spiky ? 'Yes' : 'No'], ['Views ÷ subscribers %', 'viewsToSubs'],
        ['Avg likes last 7', 'avgLikes'], ['Avg comments last 7', 'avgComments'],
        ['Uploads per month', 'uploadsPerMonth'], ['Avg video length (min)', r => r.avgLenSecs ? Math.round(r.avgLenSecs / 60) : ''],
        ['Language', 'language'], ['Made for kids', r => r.madeForKids ? 'Yes' : 'No'],
        ['Best recent video', r => r.best ? r.best.title : ''], ['Best video views', r => r.best ? r.best.views : ''], ['Best video link', r => r.best ? r.best.url : ''],
        ['Engagement % last 7', 'er7'], ['Uploads last 30 days', 'uploads30'], ['Last upload', r => (r.lastUpload || '').slice(0, 10)],
        ['Total views', 'totalViews'], ['Total videos', 'videoCount'], ['Country', 'country'], ['Channel created', r => (r.joined || '').slice(0, 10)],
        ['Emails', r => r.emails.join('; ')], ['Email source', 'emailSource'], ['Instagram', r => r.instagram.map(h => '@' + h).join('; ')],
        ['Link-in-bio', r => r.bio.join('; ')], ['Mostly Shorts', r => r.shortsShare >= 0.7 ? 'Yes' : 'No'],
        ['Based in chosen region', r => ({ yes: 'Yes', likely: 'Probably (mentions it)', no: 'No', unknown: 'Unknown' })[discBased(r)] || ''],
        ['Indian creator', r => r.indian ? 'Yes' : 'No'], ['Indian signals', 'indianWhy'],
        ['Location checked', 'locLabel'], ['Mentions location', r => r.locHit == null ? '' : (r.locHit ? 'Yes' : 'No')],
        ['Already in CRM', r => r.crmProfileId ? 'Yes' : 'No'], ['CRM match by', r => r.crmMatch || ''], ['Matched search terms', r => r.terms.join('; ')], ['Description', 'description'],
      ];
      const cell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
      const lines = [cols.map(c => c[0]).join(',')].concat(
        discVisible().map(r => cols.map(([, k]) => cell(typeof k === 'function' ? k(r) : r[k])).join(','))
      );
      const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `youtube-creators-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function discRenderResults() {
      const host = document.getElementById('disc-results');
      if (!host) return;
      const rows = discVisible();
      const countN = document.getElementById('disc-count');
      if (countN) countN.textContent = DISC.results.length ? `${rows.length} of ${DISC.results.length} shown` : '';
      const hidN = document.getElementById('disc-hidden');
      if (hidN) {
        const h = DISC.results.length ? discHiddenSummary(rows.length) : { text: '', tip: '' };
        hidN.innerHTML = (h.text ? `<div>${escape(h.text)}</div>` : '') + (h.tip ? `<div class="text-amber-700 mt-0.5">${escape(h.tip)}</div>` : '');
      }
      discSyncControls();

      const cols = [
        ['title', 'Channel', ''], ['genre', 'Genre', ''], ['subs', 'Subscribers', 'r'], ['avg3', 'Avg views (last 3)', 'r'], ['avg7', 'Avg views (last 7)', 'r'],
        ['median7', 'Median views (last 7)', 'r'], ['viewsToSubs', 'Views ÷ subscribers', 'r'],
        ['er7', 'Engagement (last 7)', 'r'], ['avgLikes', 'Avg likes / comments', 'r'],
        ['uploadsPerMonth', 'Uploads / month', 'r'], ['avgLenSecs', 'Avg length', 'r'], ['language', 'Language', ''],
        ['lastUpload', 'Last upload', ''], [null, 'Best recent video', ''],
        ['totalViews', 'Total views', 'r'], ['videoCount', 'Videos', 'r'], ['country', 'Country', ''],
        [null, 'Email / Instagram', ''], [null, 'Description', ''], [null, '', ''],
      ];
      const th = cols.map(([k, label, align]) => {
        const arrow = k && k === DISC.sortKey ? (DISC.sortDir < 0 ? ' ↓' : ' ↑') : '';
        return `<th ${k ? `data-sort="${k}"` : ''} class="px-3 py-2.5 text-[11px] font-semibold text-stone-500 whitespace-nowrap bg-stone-50 border-b border-stone-200 ${align === 'r' ? 'text-right' : 'text-left'} ${k ? 'cursor-pointer hover:text-stone-800' : ''}">${escape(label)}${arrow}</th>`;
      }).join('');

      let body;
      if (!rows.length) {
        const msg = DISC.running ? 'Searching… results will appear here as they load.'
          : DISC.results.length ? 'No channels match these filters.'
          : 'Enter search terms above and select Find channels.';
        body = `<tr><td colspan="${cols.length}" class="px-4 py-12 text-center text-sm text-stone-500">${escape(msg)}</td></tr>`;
      } else {
        body = rows.map(r => {
          const contacts = [
            ...r.emails.map(e => `<a href="mailto:${escape(e)}" class="block text-brand break-all">${escape(e)}</a>`),
            ...r.instagram.map(h => `<a href="https://instagram.com/${escape(h)}" target="_blank" rel="noopener" class="block text-brand">IG @${escape(h)}</a>`),
            ...r.bio.map(u => `<a href="${escape(u)}" target="_blank" rel="noopener" class="block text-brand break-all">${escape(u.replace(/^https?:\/\/(www\.)?/, ''))}</a>`),
          ].join('');
          const action = r.crmProfileId
            ? (typeof r.crmProfileId === 'string'
                ? `<a href="#profiles/${escape(r.crmProfileId)}" class="badge bg-emerald-50 text-emerald-700 whitespace-nowrap">In CRM · view</a>${r.crmMatch && r.crmMatch !== 'added' ? `<div class="text-[11px] text-stone-400 mt-1 whitespace-nowrap">matched by ${escape(r.crmMatch)}</div>` : ''}`
                : `<span class="badge bg-emerald-50 text-emerald-700 whitespace-nowrap">In CRM</span>`)
            : `<button data-add="${escape(r.id)}" class="px-2.5 py-1 text-xs rounded-lg btn-brand whitespace-nowrap">+ Add to CRM</button>`;
          return `<tr class="border-b border-stone-100 hover:bg-stone-50/60 align-top">
            <td class="px-3 py-2.5"><div class="flex gap-2.5 items-start min-w-[220px]">
              ${r.thumb ? `<img src="${escape(r.thumb)}" alt="" loading="lazy" class="w-9 h-9 rounded-full bg-stone-200 flex-none">` : '<div class="w-9 h-9 rounded-full bg-stone-200 flex-none"></div>'}
              <div class="min-w-0">
                <a href="${escape(r.link)}" target="_blank" rel="noopener" class="font-medium text-stone-900 hover:underline">${escape(r.title)}</a>
                <div class="text-xs text-stone-500">${escape(r.handle || r.id)}</div>
                ${r.shortsShare >= 0.7 ? '<span class="badge bg-amber-50 text-amber-700 mt-1">Mostly Shorts</span>' : ''}
                ${r.locHit ? `<span class="badge bg-emerald-50 text-emerald-700 mt-1">Mentions ${escape(r.locLabel)}</span>` : ''}
                ${(() => {
                  const b = discBased(r), reg = discCountryName(DISC.form.region);
                  if (b === 'yes') return `<span class="badge bg-emerald-50 text-emerald-700 mt-1" title="Channel country is set to ${escape(reg)}">Based in ${escape(reg)}</span>`;
                  if (b === 'likely') return `<span class="badge bg-emerald-50 text-emerald-700 mt-1" title="No country set on the channel, but it mentions ${escape(r.locLabel || reg)}">Probably in ${escape(reg)}</span>`;
                  if (b === 'no') return `<span class="badge bg-stone-100 text-stone-600 mt-1" title="Channel country on YouTube">Based in ${escape(discCountryName(r.country))}</span>`;
                  return '';
                })()}
                ${r.indian ? `<span class="badge bg-sky-50 text-sky-700 mt-1" title="${escape(r.indianWhy)}">Indian creator</span>` : ''}
                ${r.madeForKids ? '<span class="badge bg-rose-50 text-rose-700 mt-1" title="YouTube marks this content as made for kids: comments are off and targeted ads are blocked">Made for kids</span>' : ''}
              </div></div></td>
            <td class="px-3 py-2.5 whitespace-nowrap">${r.genre
                ? `<span class="badge bg-indigo-50 text-indigo-700">${escape(r.genre)}</span>${r.genreAlso.length ? `<div class="text-[11px] text-stone-400 mt-1">also ${escape(r.genreAlso.join(', '))}</div>` : ''}`
                : '<span class="text-stone-400 text-xs">Not sure</span>'}</td>
            <td class="px-3 py-2.5 text-right tabular-nums">${r.subs == null ? '<span class="text-stone-400">Hidden</span>' : ytNum(r.subs)}</td>
            <td class="px-3 py-2.5 text-right tabular-nums">${ytNum(r.avg3)}</td>
            <td class="px-3 py-2.5 text-right tabular-nums">${ytNum(r.avg7)}${r.shortsFallback ? '<div class="text-[11px] text-amber-700">Shorts only</div>' : (r.n7 && r.n7 < 7 ? `<div class="text-[11px] text-stone-400">from ${r.n7} videos</div>` : '')}</td>
            <td class="px-3 py-2.5 text-right tabular-nums">${ytNum(r.median7)}${r.spiky ? '<div><span class="badge bg-amber-50 text-amber-700 mt-1 whitespace-nowrap" title="One video is pulling the average up; the median is the more realistic number">One video inflating avg</span></div>' : ''}</td>
            <td class="px-3 py-2.5 text-right tabular-nums">${r.viewsToSubs == null ? '—' : `<span class="${r.viewsToSubs >= 20 ? 'text-emerald-700 font-medium' : r.viewsToSubs < 5 ? 'text-rose-600' : ''}">${r.viewsToSubs}%</span>`}</td>
            <td class="px-3 py-2.5 text-right tabular-nums">${r.er7 == null ? '—' : r.er7 + '%'}</td>
            <td class="px-3 py-2.5 text-right tabular-nums whitespace-nowrap">${ytNum(r.avgLikes)} <span class="text-stone-400">/</span> ${ytNum(r.avgComments)}</td>
            <td class="px-3 py-2.5 text-right tabular-nums">${r.uploadsPerMonth == null ? '—' : r.uploadsPerMonth}</td>
            <td class="px-3 py-2.5 text-right whitespace-nowrap">${discFmtLen(r.avgLenSecs)}</td>
            <td class="px-3 py-2.5 whitespace-nowrap">${escape(r.language || '—')}</td>
            <td class="px-3 py-2.5 whitespace-nowrap">${fmtDate(r.lastUpload)}</td>
            <td class="px-3 py-2.5 text-xs max-w-[240px]">${r.best
                ? `<a href="${escape(r.best.url)}" target="_blank" rel="noopener" class="text-brand hover:underline line-clamp-2">${escape(r.best.title)}</a><div class="text-[11px] text-stone-400 mt-0.5">${ytNum(r.best.views)} views</div>`
                : '—'}</td>
            <td class="px-3 py-2.5 text-right tabular-nums">${ytNum(r.totalViews)}</td>
            <td class="px-3 py-2.5 text-right tabular-nums">${ytNum(r.videoCount)}</td>
            <td class="px-3 py-2.5">${escape(r.country || '—')}</td>
            <td class="px-3 py-2.5 text-xs max-w-[240px]">${contacts || '<span class="text-stone-400">None found</span>'}
              ${r.emailSource ? `<div class="text-[11px] text-stone-400 mt-0.5">Email from ${escape(r.emailSource)}</div>` : ''}</td>
            <td class="px-3 py-2.5"><div data-desc class="text-xs text-stone-500 max-w-[320px] max-h-[3.9em] overflow-hidden whitespace-pre-wrap cursor-pointer" title="Click to expand">${escape(r.description || '—')}</div></td>
            <td class="px-3 py-2.5">${action}</td>
          </tr>`;
        }).join('');
      }
      host.innerHTML = `<div class="overflow-x-auto scrollbar-thin bg-white border border-stone-200 rounded-xl">
        <table class="w-full min-w-[2100px] text-sm"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function viewDiscover() {
      const f = DISC.form;
      const inputCls = 'mt-1 w-full px-3 py-2 text-sm border border-stone-200 rounded-lg focus:outline-none focus:border-stone-400 bg-white';
      const labelEl = (text, control, extra = '') => el('label', { class: 'block ' + extra },
        el('span', { class: 'text-xs font-medium text-stone-600' }, text), control);
      const bind = (key, node, isCheck = false) => {
        node.addEventListener(isCheck ? 'change' : 'input', () => { f[key] = isCheck ? node.checked : node.value; });
        return node;
      };
      const mkSelect = (key, options) => bind(key, el('select', { class: inputCls },
        ...options.map(([v, l]) => el('option', { value: v, selected: f[key] === v }, l))));
      const mkCheck = (key, text) => {
        const cb = bind(key, el('input', { type: 'checkbox', checked: !!f[key], class: 'mt-0.5 rounded border-stone-300' }), true);
        return el('label', { class: 'inline-flex items-start gap-2 text-sm text-stone-700 cursor-pointer' }, cb, el('span', {}, text));
      };

      // API key row
      const keyInput = el('input', { type: 'password', autocomplete: 'off', placeholder: 'Paste your YouTube Data API key', value: ytGetKey(), class: inputCls });
      const keyCard = el('div', { class: 'bg-white border border-stone-200 rounded-xl p-4 mb-4' },
        el('div', { class: 'flex flex-col sm:flex-row gap-2 sm:items-end' },
          labelEl('YouTube Data API key (saved only in this browser)', keyInput, 'flex-1'),
          el('button', { class: 'px-3 py-2 text-sm rounded-lg border border-stone-200 bg-white hover:bg-stone-50', onClick: () => {
            const ok = ytSetKey(keyInput.value.trim());
            toast(ok ? 'API key saved in this browser' : 'Could not save the key in this browser', ok ? 'success' : 'error');
          } }, 'Save key')
        )
      );

      const sentenceInp = el('input', { type: 'text', value: f.sentence || '', placeholder: 'e.g. Tamil content creators who have kids, under 1 lakh subscribers',
        class: 'flex-1 px-3 py-2.5 text-sm border border-stone-200 rounded-lg focus:outline-none focus:border-stone-400 bg-white',
        onkeydown: (e) => { if (e.key === 'Enter' && !DISC.running) discRunSentence(sentenceInp.value); } });
      const plan = DISC.lastPlan;
      const sentenceCard = el('div', { class: 'bg-white border border-stone-200 rounded-xl p-4 mb-4' },
        el('div', { id: 'disc-usage', class: 'mb-4' }),
        el('div', { class: 'text-sm font-medium text-stone-800 mb-2' }, 'Describe who you’re looking for'),
        el('div', { class: 'flex flex-col sm:flex-row gap-2' },
          sentenceInp,
          el('button', { class: 'px-4 py-2.5 text-sm rounded-lg btn-brand whitespace-nowrap', disabled: DISC.running,
            onClick: () => discRunSentence(sentenceInp.value) }, 'Find creators')
        ),
        plan ? el('p', { class: 'text-xs text-stone-500 mt-2' },
          `Understood: ${plan.langName || 'any language'}, ${plan.genre || 'no specific topic'}, ${plan.placeLabel ? plan.placeLabel + ' (' + plan.countryLabel + ')' : (plan.countryLabel || 'any location')}` +
          (plan.minSubs || plan.maxSubs ? `, ${plan.minSubs ? ytNum(plan.minSubs) : '0'} to ${plan.maxSubs ? ytNum(plan.maxSubs) : 'any'} subscribers` : '') +
          `. Running ${plan.terms.length} searches, listed below. You can edit them and select Find channels to search again.`)
          : el('p', { class: 'text-xs text-stone-500 mt-2' }, 'Mention a language or region, the kind of creator, and optionally a size like “under 50k”. Or type your own search terms in the advanced search below.')
      );

      const importBox = bind('importText', el('textarea', { rows: '3', placeholder: 'https://www.youtube.com/@channelname\n@anotherchannel\nhttps://www.youtube.com/channel/UC...', class: inputCls + ' resize-y' }, f.importText || ''));
      const importCard = el('details', { class: 'bg-white border border-stone-200 rounded-xl p-4 mb-4', ...(f.importText ? { open: true } : {}) },
        el('summary', { class: 'text-sm font-medium text-stone-800 cursor-pointer' }, 'Already have a list of channels? Paste links to get their stats'),
        el('p', { class: 'text-xs text-stone-500 mt-2' }, 'Paste channel links or @handles from anywhere (for example YouTube creator partnerships), one per line. Costs 1 unit per channel, almost free.'),
        importBox,
        el('div', { class: 'mt-3' },
          el('button', { class: 'px-3 py-2 text-sm rounded-lg btn-brand', onClick: () => {
            DISC.genre = ''; DISC.basedOnly = false; DISC.indianOnly = false; DISC.lastPlan = null;
            runDiscover({ import: true });
          } }, 'Get stats for these channels'))
      );

      const termsBox = bind('terms', el('textarea', { rows: '3', class: inputCls + ' resize-y' }, f.terms));
      const searchCard = el('div', { class: 'bg-white border border-stone-200 rounded-xl p-4 mb-4' },
        el('div', { class: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3' },
          labelEl('Advanced: search terms (one per line, each is a separate search)', termsBox, 'sm:col-span-2'),
          labelEl('Region', mkSelect('region', [['', 'Any (no region filter)'], ...DISC_NL_COUNTRIES.map(c => [c.code, c.label])])),
          labelEl('Language', mkSelect('lang', [['', 'Any'], ['en', 'English'], ['hi', 'Hindi'], ['ta', 'Tamil'], ['te', 'Telugu'], ['kn', 'Kannada'], ['ml', 'Malayalam'], ['mr', 'Marathi'], ['bn', 'Bengali'], ['gu', 'Gujarati'], ['pa', 'Punjabi'], ['ur', 'Urdu'], ['ne', 'Nepali'],
            ['id', 'Indonesian'], ['ms', 'Malay'], ['tl', 'Filipino'], ['th', 'Thai'], ['vi', 'Vietnamese'], ['ja', 'Japanese'], ['ko', 'Korean'],
            ['ar', 'Arabic'], ['es', 'Spanish'], ['pt', 'Portuguese'], ['fr', 'French'], ['de', 'German'], ['it', 'Italian'], ['nl', 'Dutch'], ['tr', 'Turkish']])),
          labelEl('Search in', mkSelect('searchType', [['video', 'Videos (finds the most creators)'], ['channel', 'Channel names only'], ['both', 'Both (uses 2× budget)']])),
          labelEl('Results per search term', mkSelect('perTerm', [['10', '10'], ['20', '20'], ['25', '25'], ['50', '50'], ['100', '100'], ['150', '150']])),
          labelEl('Min subscribers', bind('minSubs', el('input', { type: 'number', min: '0', value: f.minSubs, class: inputCls }))),
          labelEl('Max subscribers (blank = no limit)', bind('maxSubs', el('input', { type: 'number', min: '0', value: f.maxSubs, placeholder: 'e.g. 500000', class: inputCls }))),
          labelEl('Location the channel mentions (city / state, optional)', (() => {
            const inp = el('input', { type: 'text', value: f.location || '', placeholder: 'e.g. Texas, Chennai, Dubai', class: inputCls });
            inp.addEventListener('input', () => { f.location = inp.value; f.locWords = null; });
            return inp;
          })()),
          labelEl('Uploaded within last', mkSelect('activeDays', [['30', '30 days'], ['90', '90 days'], ['180', '180 days'], ['0', 'Any time']]))
        ),
        el('div', { class: 'flex flex-wrap gap-x-6 gap-y-2 mt-3' },
          mkCheck('longOnly', 'Long videos only for averages (skip videos 3 min or shorter, i.e. Shorts)'),
          mkCheck('countryOnly', 'Only channels whose country is set to the chosen region')
        ),
        el('div', { class: 'flex flex-wrap items-center gap-2 mt-4' },
          el('button', { id: 'disc-run', class: 'px-3 py-2 text-sm rounded-lg btn-brand', onClick: runDiscover }, 'Find channels'),
          el('button', { id: 'disc-stop', class: 'px-3 py-2 text-sm rounded-lg border border-stone-200 bg-white hover:bg-stone-50 disabled:opacity-50', onClick: () => { DISC.stop = true; discSetStatus('Stopping after current requests…'); } }, 'Stop'),
          el('span', { id: 'disc-status', class: 'text-sm ' + (DISC.statusErr ? 'text-rose-600' : 'text-stone-500') }, DISC.status)
        ),
        el('div', { class: 'h-1.5 bg-stone-100 rounded mt-3 overflow-hidden' },
          el('div', { id: 'disc-bar', class: 'h-full transition-all', style: `width:${DISC.progress}%; background-color: var(--brand);` }))
      );

      const filterInp = el('input', { type: 'search', placeholder: 'Filter by name, handle or description', value: DISC.filter,
        class: 'w-full sm:w-72 px-3 py-2 text-sm border border-stone-200 rounded-lg focus:outline-none focus:border-stone-400 bg-white',
        oninput: (e) => { DISC.filter = e.target.value; discRenderResults(); } });
      const toggle = (key, text) => {
        const cb = el('input', { type: 'checkbox', checked: DISC[key], class: 'rounded border-stone-300',
          onchange: (e) => { DISC[key] = e.target.checked; discRenderResults(); } });
        return el('label', { class: 'inline-flex items-center gap-1.5 text-sm text-stone-700 cursor-pointer' }, cb, text);
      };
      const toolbar = el('div', { class: 'flex flex-wrap items-center gap-3 mb-3' },
        filterInp,
        el('select', { class: 'px-3 py-2 text-sm border border-stone-200 rounded-lg focus:outline-none focus:border-stone-400 bg-white',
          onchange: (e) => { DISC.genre = e.target.value; discRenderResults(); } },
          el('option', { value: '', selected: DISC.genre === '' }, 'All genres'),
          ...DISC_GENRES.map(g => el('option', { value: g, selected: DISC.genre === g }, g)),
          el('option', { value: '__none', selected: DISC.genre === '__none' }, 'Genre not detected')
        ),
        toggle('hideCrm', 'Hide channels already in CRM'), toggle('emailOnly', 'Only with email'),
        toggle('locOnly', 'Only channels that mention the location'),
        toggle('indianOnly', 'Only Indian creators'),
        toggle('basedOnly', 'Only creators based in the chosen region'),
        toggle('hideKids', 'Hide “Made for kids” channels'),
        el('span', { id: 'disc-count', class: 'text-sm text-stone-500' }),
        el('div', { class: 'flex-1' }),
        el('button', { id: 'disc-csv', class: 'px-3 py-2 text-sm rounded-lg border border-stone-200 bg-white hover:bg-stone-50 disabled:opacity-50', onClick: discDownloadCsv }, '⬇ Download CSV')
      );

      const hiddenLine = el('div', { id: 'disc-hidden', class: 'text-xs text-stone-500 -mt-1 mb-3' });
      const results = el('div', { id: 'disc-results' });
      results.addEventListener('click', (e) => {
        const sortTh = e.target.closest('th[data-sort]');
        if (sortTh) {
          const k = sortTh.dataset.sort;
          if (DISC.sortKey === k) DISC.sortDir *= -1;
          else { DISC.sortKey = k; DISC.sortDir = (k === 'title' || k === 'country' || k === 'genre' || k === 'language') ? 1 : -1; }
          return discRenderResults();
        }
        const addBtn = e.target.closest('button[data-add]');
        if (addBtn) {
          const r = DISC.results.find(x => x.id === addBtn.dataset.add);
          if (r) discAddToCrm(r);
          return;
        }
        const d = e.target.closest('[data-desc]');
        if (d) d.classList.toggle('max-h-[3.9em]');
      });

      const page = el('div', {},
        el('div', { class: 'mb-5' },
          el('h1', { class: 'text-xl font-semibold text-stone-900 tracking-tight' }, 'YouTube Discovery'),
          el('p', { class: 'text-sm text-stone-500 mt-1' }, 'Search YouTube channels by topic, compare average views on their latest videos, and add the right ones to the CRM.')
        ),
        ytHasBuiltInKey() ? null : keyCard, sentenceCard, importCard, searchCard, toolbar, hiddenLine, results
      );
      // Fill the table and button states once the page is in the DOM
      setTimeout(() => { discRenderResults(); discSyncControls(); discRenderUsage(); }, 0);
      return page;
    }

    // ===============================================================
    // ROUTING + MAIN RENDER
    // ===============================================================
    const ROUTES = {
      campaigns: { label: 'Campaigns', icon: '🎯', view: viewCampaigns, prefetch: fetchCampaigns },
      profiles:  { label: 'Profiles',  icon: '👤', view: viewProfiles,  prefetch: fetchProfiles },
      discover:  { label: 'YouTube Discovery', icon: '🔎', view: viewDiscover, prefetch: fetchDiscover },
      followups: { label: 'Follow-ups', icon: '⏰', view: viewFollowups, prefetch: fetchFollowups },
      agreement: { label: 'Agreement Form', icon: '📄', view: viewAgreementForm },
      myreachout: { label: 'My Reach-out', icon: '📊', view: viewMyReachout, prefetch: fetchMyReachout, hideForAdmin: true },
      reports:   { label: 'Reports',    icon: '📈', view: viewReports,   prefetch: fetchReports, adminOnly: true },
      team:      { label: 'Team',       icon: '👥', view: viewTeam,      prefetch: fetchTeam,    adminOnly: true },
    };

    function parseRoute() {
      const h = (window.location.hash || '#campaigns').slice(1);
      const [route, param] = h.split('/');
      state.route = ROUTES[route] ? route : 'campaigns';
      state.routeParam = param || null;
    }

    async function refresh(which) {
      const r = ROUTES[which];
      if (r?.prefetch) await r.prefetch();
      render();
    }

    function render() {
      const r = ROUTES[state.route];
      let body;
      if (state.routeParam && state.route === 'campaigns') {
        body = viewCampaignDetail();
      } else if (state.routeParam && state.route === 'profiles') {
        body = viewProfileDetail();
      } else {
        body = r.view();
      }

      const sidebar = el('aside', { id: 'sidebar', class: 'sidebar-mobile md:translate-x-0 fixed md:static z-30 inset-y-0 left-0 w-64 bg-white border-r border-stone-200 flex flex-col' },
        el('div', { class: 'px-6 py-5 border-b border-stone-200 flex items-center justify-between' },
          el('img', { src: 'data:image/png;base64,' + LOGO_B64, alt: 'BrightChamps', class: 'h-[100px] w-auto' }),
          el('button', { class: 'md:hidden text-stone-500 text-2xl leading-none', onClick: () => $('#sidebar').classList.remove('open') }, '×')
        ),
        el('div', { class: 'px-6 pt-4 pb-2 text-[10px] font-bold text-stone-400 uppercase tracking-widest' }, 'Influencer CRM'),
        el('nav', { class: 'flex-1 px-3 pb-3 space-y-0.5' },
          ...Object.entries(ROUTES)
            .filter(([k, r]) => (!r.adminOnly || state.me?.role === 'admin') && (!r.hideForAdmin || state.me?.role !== 'admin'))
            .map(([k, r]) => {
              const active = state.route === k;
              const badge = (k === 'followups' && state.overdueCount > 0)
                ? el('span', { class: `ml-auto text-[10px] font-bold px-1.5 py-0.5 rounded-full ${active ? 'bg-white/30 text-white' : 'bg-rose-500 text-white'}` }, String(state.overdueCount))
                : null;
              return el('a', {
                href: '#' + k,
                class: `flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition-colors ${active ? 'text-white font-medium' : 'text-stone-700 hover:bg-stone-100'}`,
                style: active ? 'background-color: var(--brand);' : ''
              },
                el('span', { class: 'text-base' }, r.icon),
                el('span', {}, r.label),
                badge
              );
            })
        ),
        el('div', { class: 'px-4 py-3 border-t border-stone-200 bg-stone-50' },
          el('div', { class: 'flex items-center gap-2 mb-2' },
            el('div', { class: 'w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold', style: 'background-color: var(--brand);' },
              (state.me?.full_name || state.session.user.email || '?').charAt(0).toUpperCase()
            ),
            el('div', { class: 'flex-1 min-w-0' },
              el('div', { class: 'text-xs font-medium text-stone-800 truncate' }, state.me?.full_name || state.session.user.email),
              el('div', { class: 'text-[10px] text-stone-500 uppercase tracking-wide' }, state.me?.role || 'user')
            )
          ),
          el('button', { class: 'w-full text-xs text-stone-600 hover:text-stone-900 border border-stone-300 hover:border-stone-400 rounded px-2 py-1.5 bg-white transition-colors', onClick: signOut }, 'Sign out')
        )
      );

      const header = el('header', { class: 'md:hidden bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between' },
        el('button', { class: 'text-stone-700', onClick: () => $('#sidebar').classList.add('open') }, '☰'),
        el('div', { class: 'text-sm font-semibold' }, ROUTES[state.route]?.label),
        el('div', { class: 'w-6' })
      );

      const main = el('main', { class: 'flex-1 overflow-y-auto scrollbar-thin bg-stone-50' },
        header,
        el('div', { class: 'p-4 md:p-8 max-w-screen-2xl mx-auto' },
          body
        )
      );

      $('#app').innerHTML = '';
      $('#app').appendChild(el('div', { class: 'min-h-screen flex' }, sidebar, main));
    }

    // ===============================================================
    // INIT
    // ===============================================================
    function debounce(fn, ms) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    async function boot() {
      // First-time OAuth redirect: Supabase sets the session via hash → exchange happens inside getSession()
      const ok = await ensureSession();
      if (!ok) return renderLogin();

      if (!state.me) {
        // team_members row should be auto-created via the auth trigger, but allow a beat
        await new Promise(r => setTimeout(r, 500));
        state.me = await loadMe();
      }
      if (!state.me) {
        $('#app').innerHTML = `<div class="min-h-screen flex items-center justify-center text-sm text-stone-600">Your account isn't provisioned yet. Ask an admin to add you to team_members.</div>`;
        return;
      }

      await loadFilterOptions();
      await refreshOverdueCount();
      parseRoute();
      if (state.routeParam && state.route === 'campaigns') await fetchCampaignDetail(state.routeParam);
      else if (state.routeParam && state.route === 'profiles') await fetchProfileDetail(state.routeParam);
      else await ROUTES[state.route].prefetch?.();
      render();

      window.addEventListener('hashchange', async () => {
        parseRoute();
        state.detail = { campaign: null, profile: null, activities: [], audit: [], loading: false };
        if (state.routeParam && state.route === 'campaigns') {
          state.detail.loading = true; render();
          await fetchCampaignDetail(state.routeParam);
        } else if (state.routeParam && state.route === 'profiles') {
          state.detail.loading = true; render();
          await fetchProfileDetail(state.routeParam);
        } else {
          const r = ROUTES[state.route];
          if (r?.prefetch) await r.prefetch();
        }
        await refreshOverdueCount();
        render();
        $('#sidebar')?.classList.remove('open');
      });
    }

    function renderLogin() {
      $('#app').innerHTML = '';
      $('#app').appendChild(
        el('div', { class: 'min-h-screen flex items-center justify-center p-4 bg-stone-50' },
          el('div', { class: 'bg-white border border-stone-200 rounded-2xl shadow-sm p-8 w-full max-w-sm text-center' },
            el('img', { src: 'data:image/png;base64,' + LOGO_B64, alt: 'BrightChamps', class: 'h-[88px] w-auto mx-auto mb-4' }),
            el('div', { class: 'text-lg font-semibold text-stone-900 mb-1' }, 'Influencer CRM'),
            el('div', { class: 'text-sm text-stone-500 mb-6' }, 'Sign in to continue'),
            el('button', {
              class: 'w-full px-4 py-2.5 btn-brand text-sm font-medium rounded-lg flex items-center justify-center gap-2',
              onClick: signIn
            }, '🔐  Sign in with Google'),
            el('p', { class: 'text-[11px] text-stone-400 mt-4' }, `Restricted to @${ALLOWED_DOMAIN} accounts`)
          )
        )
      );
    }

    boot().catch(e => { console.error(e); $('#app').innerHTML = `<pre class="p-6 text-xs text-rose-700">${escape(e.stack || e.message)}</pre>`; });
  </script>
</body>
</html>
