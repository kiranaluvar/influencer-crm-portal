    // ===============================================================
    // DETAIL HELPERS — sub_status options, file upload, etc.
    // ===============================================================
    function allowedSubStatuses(currentSub) {
      const map = state.filterOptions?.sub_statuses || [];
      const cur = map.find(m => m.sub === currentSub);
      if (!cur) return [];
      const curGroup = cur.group;
      // terminal lock: Post Gone Live only. Dropped is reversible — a campaign can be brought
      // back into the active pipeline from Dropped (e.g. AppSheet/reconsideration cases).
      if (curGroup === 'Post Gone Live') return [];
      if (curGroup === 'Dropped') return map; // from Dropped, any stage is selectable
      // Forward sort_order OR any Dropped sub_status
      return map.filter(m => {
        const idx = map.indexOf(m);
        const curIdx = map.indexOf(cur);
        return m.group === 'Dropped' || idx >= curIdx;
      });
    }

    // TEMPORARY: backward movement is unlocked for now (agents need to go back to e.g. "agreement done"
    // to attach docs even after a campaign moved further along). Flip this back to true to re-lock it.
    const ENFORCE_BACKWARD_LOCK = false;

    // Returns ALL stages/sub-statuses (grouped, in pipeline order) with a `locked` flag per
    // sub-status — locked = true when moving there would be backward movement (not allowed).
    // Dropped is never locked. Used so dropdowns show the full picture instead of hiding stages.
    function allSubStatusesWithLock(currentSub) {
      const map = state.filterOptions?.sub_statuses || [];
      const cur = map.find(m => m.sub === currentSub);
      const curIdx = cur ? map.indexOf(cur) : -1;
      const order = [];
      const byGroup = {};
      map.forEach(m => {
        if (!byGroup[m.group]) { byGroup[m.group] = []; order.push(m.group); }
        byGroup[m.group].push(m.sub);
      });
      return order.map(group => ({
        group,
        subs: byGroup[group].map(sub => {
          const idx = map.findIndex(m => m.sub === sub && m.group === group);
          const locked = ENFORCE_BACKWARD_LOCK && group !== 'Dropped' && !(curIdx >= 0 && idx >= curIdx);
          return { sub, locked };
        })
      }));
    }

    async function uploadCampaignFile(campaignId, kind, file) {
      const ext = file.name.split('.').pop();
      const path = `${campaignId}/${kind}-${Date.now()}.${ext}`;
      const { error } = await supabase.storage.from('campaign-files').upload(path, file, { upsert: true });
      if (error) { toast(error.message, 'error'); return null; }
      return path; // store the path, sign on view
    }

    async function signedUrl(path) {
      if (!path) return null;
      const { data } = await supabase.storage.from('campaign-files').createSignedUrl(path, 3600);
      return data?.signedUrl || null;
    }

    // Legacy `imported_poc` values only ever stored a first name (e.g. "Tushi"), never the full
    // name — so comparing it against team_members.full_name ("Tushi Agarwal") with exact string
    // equality would show "pending migration" forever even after the campaign is correctly
    // reassigned to that exact person. Treat a first-name match as resolved.
    function pocIsResolved(poc, ownerFullName) {
      if (!poc || !ownerFullName) return false;
      const p = poc.trim().toLowerCase();
      const f = ownerFullName.trim().toLowerCase();
      return f === p || f.split(/\s+/)[0] === p;
    }

    function canEditCampaign(c) {
      if (!c || !state.me) return false;
      if (state.me.role === 'admin') return true;
      if (c.owner_id === state.me.user_id) return true;
      // TL of owner
      // We don't have ownership chain client-side; let server RLS reject if not allowed.
      if (state.me.role === 'tl') return true;
      return false;
    }

    // ===============================================================
    // STATUS CHANGE MODAL
    // ===============================================================
    // Auto-builds the tracking URL from Course ID, fmt, campaign name/date, platform, and collab type.
    // Medium codes are inferred from the one example we have (Youtube -> YTC) and extended consistently;
    // the UTM Link field stays editable so an agent can correct it if a platform's code is wrong.
    // Course ID / fmt are fixed per subject rather than typed manually. Only Math is configured so far —
    // add more subjects here once their Course ID / fmt values are provided.
    const SUBJECT_COURSE_MAP = {
      Math: { courseId: '15', fmt: '206' },
      Coding: { courseId: '1', fmt: '132' },
    };

    const PLATFORM_MEDIUM_CODE = { Instagram: 'IGC', Youtube: 'YTC', Facebook: 'FBC', Tiktok: 'TTC' };
    function buildUtmLink(c, fields) {
      const courseId = fields._course_id?.value.trim();
      const fmt = fields._fmt?.value.trim();
      if (!courseId || !fmt || !fields.gone_live_date.value) return;
      const sanitize = s => (s || '').replace(/[^a-zA-Z0-9]/g, '');
      // "UTM Medium" as displayed to the agent is fields.utm_content (deliverable type dropdown) —
      // use whatever they've picked there for the link, falling back to the platform code if unset.
      const medium = sanitize(fields.utm_content?.value) || PLATFORM_MEDIUM_CODE[c.platform?.platform] || 'REF';
      const influencerName = sanitize(c.platform?.profile?.name || c.name || '').toLowerCase();
      const [y, m, d] = fields.gone_live_date.value.split('-');
      const dateStr = `${d}${m}${y}`; // DDMMYYYY, no separators
      const content = fields.is_recollab.value === 'true' ? 'RCB' : fields.is_recollab.value === 'false' ? 'New' : '';
      const params = new URLSearchParams({
        courseId, fmt,
        utm_source: 'Influencer',
        utm_medium: medium,
        utm_campaign: `${influencerName}${dateStr}`,
        utm_content: content
      });
      fields.utm_link.value = `https://learn.brightchamps.com/book-trial-class?${params.toString()}#form`;
      if (fields.utm_medium) fields.utm_medium.value = medium;
    }

    function openStatusChangeModal(c) {
      const allowed = allowedSubStatuses(c.sub_status);
      if (!allowed.length) { toast('This campaign is terminal — no further status changes', 'info'); return; }

      const wrap = el('div', { class: 'space-y-3' });
      const fields = {};
      const conditionalArea = el('div', { class: 'space-y-2 pt-2 border-t border-stone-200' });

      const subSel = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
      subSel.appendChild(el('option', { value: '' }, '— Pick new sub-status —'));
      allSubStatusesWithLock(c.sub_status).forEach(({ group, subs }) => {
        const og = document.createElement('optgroup');
        og.label = group;
        subs.forEach(({ sub, locked }) => {
          const opt = el('option', { value: sub }, locked ? `${sub} (locked — backward)` : sub);
          if (locked) opt.disabled = true;
          og.appendChild(opt);
        });
        subSel.appendChild(og);
      });
      fields.sub_status = subSel;

      const fuWrap = el('label', { class: 'block' },
        el('span', { class: 'text-xs font-medium text-stone-600' }, 'Next Follow-up (date & time) *'),
        fields.next_followup_at = el('input', { type: 'datetime-local', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' })
      );
      const fuNote = el('label', { class: 'block' },
        el('span', { class: 'text-xs font-medium text-stone-600' }, 'Follow-up note (optional)'),
        fields.next_followup_note = el('input', { type: 'text', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' })
      );

      const renderConditional = () => {
        conditionalArea.innerHTML = '';
        const target = fields.sub_status.value;
        if (!target) return;

        const map = state.filterOptions?.sub_statuses || [];
        const targetGroup = map.find(m => m.sub === target)?.group;

        // Gone Live mandatory block
        if (target === 'Gone Live') {
          fields.gone_live_date = el('input', { type: 'date', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          fields.spends_inr     = el('input', { type: 'number', step: '0.01', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          fields._course_id     = el('input', { type: 'hidden' });
          fields._fmt            = el('input', { type: 'hidden' });
          fields._subject        = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' },
            el('option', { value: '' }, '—'),
            ...Object.keys(SUBJECT_COURSE_MAP).map(s => el('option', { value: s }, s))
          );
          fields._subject.addEventListener('change', () => {
            const m = SUBJECT_COURSE_MAP[fields._subject.value];
            fields._course_id.value = m ? m.courseId : '';
            fields._fmt.value = m ? m.fmt : '';
            buildUtmLink(c, fields);
          });
          fields.utm_link       = el('input', { type: 'url', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          fields.utm_medium     = el('input', { type: 'hidden' });
          fields.utm_content    = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' },
            el('option', { value: '' }, '—'),
            ...(state.filterOptions?.utm_content || []).map(u => el('option', { value: u }, u))
          );
          fields.utm_content.addEventListener('change', () => buildUtmLink(c, fields));
          fields.is_recollab    = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' },
            el('option', { value: '' }, '—'),
            el('option', { value: 'false' }, 'New collab'),
            el('option', { value: 'true' }, 'Re-collab (RCB)')
          );
          fields.rcb_count      = el('input', { type: 'number', disabled: true, class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg disabled:bg-stone-100' });
          fields.is_recollab.addEventListener('change', () => { fields.rcb_count.disabled = fields.is_recollab.value !== 'true'; buildUtmLink(c, fields); });
          fields.gone_live_date.addEventListener('input', () => buildUtmLink(c, fields));

          [
            ['Gone Live Date *', fields.gone_live_date],
            ['Spends (₹) *', fields.spends_inr],
            ['Subject * (sets Course ID / fmt for tracking link)', fields._subject],
            ['UTM Link * (auto-generated — editable)', fields.utm_link],
            ['UTM Medium * (drives auto-task)', fields.utm_content],
            ['UTM Content *', fields.is_recollab],
            ['RCB Count (if Re-collab)', fields.rcb_count],
          ].forEach(([lbl, inp]) => conditionalArea.appendChild(el('label', { class: 'block' }, el('span', { class: 'text-xs font-medium text-stone-600' }, lbl), inp)));
        }

        // Post Gone Live mandatory block
        if (target === 'Post Gone Live') {
          fields.gone_live_link    = el('input', { type: 'url', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          fields.insights          = el('textarea', { rows: 3, class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          fields.google_drive_link = el('input', { type: 'url', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          [
            ['Gone Live Link *', fields.gone_live_link],
            ['Insights *', fields.insights],
            ['Google Drive Link *', fields.google_drive_link],
          ].forEach(([lbl, inp]) => conditionalArea.appendChild(el('label', { class: 'block' }, el('span', { class: 'text-xs font-medium text-stone-600' }, lbl), inp)));
        }

        // Agreement / Invoice file upload
        if (target === 'agreement done' || target === 'invoice done') {
          const which = target === 'agreement done' ? 'agreement' : 'invoice';
          const fileInp = el('input', { type: 'file', accept: 'image/*,application/pdf', class: 'mt-1 w-full text-xs' });
          fields._file = fileInp;
          fields._fileKind = which;
          conditionalArea.appendChild(el('label', { class: 'block' },
            el('span', { class: 'text-xs font-medium text-stone-600' }, `Upload ${which} file *`),
            fileInp
          ));
        }

        // Follow-up required unless target is terminal
        if (targetGroup !== 'Dropped' && targetGroup !== 'Post Gone Live') {
          conditionalArea.appendChild(fuWrap);
          conditionalArea.appendChild(fuNote);
        }
      };
      fields.sub_status.addEventListener('change', renderConditional);

      const submitBtn = el('button', { class: 'px-3 py-1.5 text-sm rounded-lg btn-brand' }, 'Save status change');
      submitBtn.addEventListener('click', async () => {
        const target = fields.sub_status.value;
        if (!target) return toast('Pick a sub-status', 'error');

        const payload = { sub_status: target };

        // File upload first if needed
        if (fields._file && fields._file.files[0]) {
          submitBtn.disabled = true; submitBtn.textContent = 'Uploading…';
          const path = await uploadCampaignFile(c.id, fields._fileKind, fields._file.files[0]);
          if (!path) { submitBtn.disabled = false; submitBtn.textContent = 'Save status change'; return; }
          payload[`${fields._fileKind}_file_url`] = path;
        }

        // Gone Live fields
        if (target === 'Gone Live') {
          payload.gone_live_date = fields.gone_live_date.value || null;
          payload.spends_inr     = fields.spends_inr.value ? parseFloat(fields.spends_inr.value) : null;
          payload.utm_link       = fields.utm_link.value.trim() || null;
          payload.utm_medium     = fields.utm_medium.value.trim() || null;
          payload.utm_content    = fields.utm_content.value || null;
          payload.is_recollab    = fields.is_recollab.value === 'true' ? true : fields.is_recollab.value === 'false' ? false : null;
          payload.rcb_count      = fields.rcb_count.value ? parseInt(fields.rcb_count.value) : null;
        }
        if (target === 'Post Gone Live') {
          payload.gone_live_link    = fields.gone_live_link.value.trim() || null;
          payload.insights          = fields.insights.value.trim() || null;
          payload.google_drive_link = fields.google_drive_link.value.trim() || null;
        }
        const map = state.filterOptions?.sub_statuses || [];
        const targetGroup = map.find(m => m.sub === target)?.group;
        if (targetGroup !== 'Dropped' && targetGroup !== 'Post Gone Live') {
          if (!fields.next_followup_at.value) { submitBtn.disabled = false; submitBtn.textContent = 'Save status change'; return toast('Next follow-up date required', 'error'); }
          payload.next_followup_at   = new Date(fields.next_followup_at.value).toISOString();
          payload.next_followup_note = fields.next_followup_note.value.trim() || null;
        }

        submitBtn.disabled = true; submitBtn.textContent = 'Saving…';
        const { error } = await supabase.from('campaigns').update(payload).eq('id', c.id);
        if (error) { submitBtn.disabled = false; submitBtn.textContent = 'Save status change'; return toast(error.message, 'error'); }

        // Log stage_change activity
        await supabase.from('campaign_activities').insert({
          campaign_id: c.id, user_id: state.me.user_id, activity_type: 'stage_change',
          note: `${c.sub_status} → ${target}`,
          metadata: {
            from: c.sub_status, to: target,
            ...(payload.next_followup_at ? { followup_at: payload.next_followup_at, followup_note: payload.next_followup_note, followup_prev_at: c.next_followup_at || null } : {})
          },
        });

        modal.close();
        toast(`Status updated to ${target}`, 'success');
        if (target === 'Gone Live') celebrateGoneLive();
        await fetchCampaignDetail(c.id);
        render();
      });

      wrap.appendChild(el('label', { class: 'block' },
        el('span', { class: 'text-xs font-medium text-stone-600' }, 'New Sub-status *'),
        subSel
      ));
      wrap.appendChild(conditionalArea);
      wrap.appendChild(el('div', { class: 'flex justify-end gap-2 pt-3 border-t border-stone-200' },
        el('button', { class: 'px-3 py-1.5 text-sm rounded-lg border border-stone-200 bg-white hover:bg-stone-50', onClick: () => modal.close() }, 'Cancel'),
        submitBtn
      ));

      const modal = renderModal('Change Status', wrap);
    }

    // ===============================================================
    // LOG ACTIVITY MODAL (with optional stage change)
    // Stage shown via optgroup; sub-stage values listed inside.
    // ===============================================================
    function openLogActivityModal(c) {
      const fields = {};
      const wrap = el('div', { class: 'space-y-3' });
      const isTerminalNow = c.group_status === 'Post Gone Live';

      // --- Activity section ---
      fields.activity_type = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' },
        ...['call','whatsapp','email','dm','comment'].map(t => el('option', { value: t }, t))
      );
      fields.note = el('textarea', { rows: 3, class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg', placeholder: 'What happened?' });

      wrap.appendChild(el('div', { class: 'text-[11px] font-semibold uppercase tracking-wide text-stone-500' }, 'Activity'));
      wrap.appendChild(el('label', { class: 'block' }, el('span', { class: 'text-xs font-medium text-stone-600' }, 'Type *'), fields.activity_type));
      wrap.appendChild(el('label', { class: 'block' }, el('span', { class: 'text-xs font-medium text-stone-600' }, 'Note'), fields.note));

      // --- Stage section ---
      wrap.appendChild(el('div', { class: 'pt-3 mt-3 border-t border-stone-200 text-[11px] font-semibold uppercase tracking-wide text-stone-500' }, 'Stage'));
      wrap.appendChild(el('div', { class: 'text-xs text-stone-600' },
        'Current: ', el('span', { class: `badge ${groupStatusColor(c.group_status)}` }, c.group_status), ' · ',
        el('span', { class: 'text-stone-500' }, c.sub_status)
      ));

      if (isTerminalNow) {
        wrap.appendChild(el('p', { class: 'text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1.5' },
          'This campaign is terminal — stage can no longer change. You can still log a comment.'
        ));
      }

      // Sub-status dropdown grouped by Stage (optgroup) — shows ALL stages/sub-statuses;
      // backward ones are visible but disabled (locked) rather than hidden.
      const subSel = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
      subSel.appendChild(el('option', { value: '' }, '— No stage change —'));
      if (!isTerminalNow) {
        allSubStatusesWithLock(c.sub_status).forEach(({ group, subs }) => {
          const og = document.createElement('optgroup');
          og.label = group;
          subs.forEach(({ sub, locked }) => {
            const opt = el('option', { value: sub }, locked ? `${sub} (locked — backward)` : sub);
            if (locked) opt.disabled = true;
            og.appendChild(opt);
          });
          subSel.appendChild(og);
        });
      }
      fields.sub_status = subSel;

      if (!isTerminalNow) {
        wrap.appendChild(el('label', { class: 'block' },
          el('span', { class: 'text-xs font-medium text-stone-600' }, 'Move to Sub-stage (optional, grouped by Stage)'),
          subSel
        ));
      }

      // Conditional area for mandatory fields per target sub-status
      const conditionalArea = el('div', { class: 'space-y-2' });
      wrap.appendChild(conditionalArea);

      // --- Follow-up section ---
      const fuWrap = el('div', { class: 'pt-3 mt-3 border-t border-stone-200' },
        el('div', { class: 'text-[11px] font-semibold uppercase tracking-wide text-stone-500 mb-2' }, 'Follow-up'),
        el('label', { class: 'block' },
          el('span', { class: 'text-xs font-medium text-stone-600' }, 'Next follow-up (date & time) *'),
          fields.next_followup_at = el('input', { type: 'datetime-local', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' })
        ),
        el('label', { class: 'block' },
          el('span', { class: 'text-xs font-medium text-stone-600' }, 'Follow-up note (optional)'),
          fields.next_followup_note = el('input', { type: 'text', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' })
        )
      );

      const renderConditional = () => {
        conditionalArea.innerHTML = '';
        const target = fields.sub_status.value;
        const map = state.filterOptions?.sub_statuses || [];
        const targetGroup = target ? map.find(m => m.sub === target)?.group : null;

        if (target === 'Gone Live') {
          fields.gone_live_date = el('input', { type: 'date', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          fields.spends_inr     = el('input', { type: 'number', step: '0.01', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          fields._course_id     = el('input', { type: 'hidden' });
          fields._fmt            = el('input', { type: 'hidden' });
          fields._subject        = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' },
            el('option', { value: '' }, '—'),
            ...Object.keys(SUBJECT_COURSE_MAP).map(s => el('option', { value: s }, s))
          );
          fields._subject.addEventListener('change', () => {
            const m = SUBJECT_COURSE_MAP[fields._subject.value];
            fields._course_id.value = m ? m.courseId : '';
            fields._fmt.value = m ? m.fmt : '';
            buildUtmLink(c, fields);
          });
          fields.utm_link       = el('input', { type: 'url', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          fields.utm_medium     = el('input', { type: 'hidden' });
          fields.utm_content    = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' },
            el('option', { value: '' }, '—'),
            ...(state.filterOptions?.utm_content || []).map(u => el('option', { value: u }, u))
          );
          fields.utm_content.addEventListener('change', () => buildUtmLink(c, fields));
          fields.is_recollab    = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' },
            el('option', { value: '' }, '—'),
            el('option', { value: 'false' }, 'New collab'),
            el('option', { value: 'true' }, 'Re-collab (RCB)')
          );
          fields.rcb_count      = el('input', { type: 'number', disabled: true, class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg disabled:bg-stone-100' });
          fields.is_recollab.addEventListener('change', () => { fields.rcb_count.disabled = fields.is_recollab.value !== 'true'; buildUtmLink(c, fields); });
          fields.gone_live_date.addEventListener('input', () => buildUtmLink(c, fields));

          conditionalArea.appendChild(el('div', { class: 'text-[11px] font-semibold uppercase tracking-wide text-emerald-700 pt-1' }, 'Gone Live — required fields'));
          [
            ['Gone Live Date *', fields.gone_live_date],
            ['Spends (₹) *', fields.spends_inr],
            ['Subject * (sets Course ID / fmt for tracking link)', fields._subject],
            ['UTM Link * (auto-generated — editable)', fields.utm_link],
            ['UTM Medium * (drives auto-task)', fields.utm_content],
            ['UTM Content *', fields.is_recollab],
            ['RCB Count (if Re-collab)', fields.rcb_count],
          ].forEach(([lbl, inp]) => conditionalArea.appendChild(el('label', { class: 'block' }, el('span', { class: 'text-xs font-medium text-stone-600' }, lbl), inp)));
        }

        if (target === 'Post Gone Live') {
          fields.gone_live_link    = el('input', { type: 'url', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          fields.insights          = el('textarea', { rows: 3, class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          fields.google_drive_link = el('input', { type: 'url', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
          conditionalArea.appendChild(el('div', { class: 'text-[11px] font-semibold uppercase tracking-wide text-emerald-700 pt-1' }, 'Post Gone Live — required fields'));
          [
            ['Gone Live Link *', fields.gone_live_link],
            ['Insights *', fields.insights],
            ['Google Drive Link *', fields.google_drive_link],
          ].forEach(([lbl, inp]) => conditionalArea.appendChild(el('label', { class: 'block' }, el('span', { class: 'text-xs font-medium text-stone-600' }, lbl), inp)));
        }

        if (target === 'agreement done' || target === 'invoice done') {
          const which = target === 'agreement done' ? 'agreement' : 'invoice';
          fields._file = el('input', { type: 'file', accept: 'image/*,application/pdf', class: 'mt-1 w-full text-xs' });
          fields._fileKind = which;
          conditionalArea.appendChild(el('div', { class: 'text-[11px] font-semibold uppercase tracking-wide text-indigo-700 pt-1' }, 'Document upload'));
          conditionalArea.appendChild(el('label', { class: 'block' },
            el('span', { class: 'text-xs font-medium text-stone-600' }, `Upload ${which} file *`),
            fields._file
          ));
        }

        // Follow-up — required if current campaign is non-terminal OR target is non-terminal
        const needsFollowup = (!isTerminalNow && (!target || (targetGroup !== 'Dropped' && targetGroup !== 'Post Gone Live')));
        if (fuWrap.parentNode) fuWrap.remove();
        if (needsFollowup) conditionalArea.appendChild(fuWrap);
      };
      fields.sub_status.addEventListener('change', renderConditional);
      renderConditional();

      // --- Submit ---
      const submitBtn = el('button', { class: 'px-3 py-1.5 text-sm rounded-lg btn-brand' }, 'Save');
      submitBtn.addEventListener('click', async () => {
        const target = fields.sub_status?.value || '';
        const map = state.filterOptions?.sub_statuses || [];
        const targetGroup = target ? map.find(m => m.sub === target)?.group : null;
        const needsFollowup = (!isTerminalNow && (!target || (targetGroup !== 'Dropped' && targetGroup !== 'Post Gone Live')));

        if (needsFollowup && !fields.next_followup_at?.value) {
          return toast('Next follow-up date is required (campaign is active)', 'error');
        }

        submitBtn.disabled = true; submitBtn.textContent = 'Saving…';

        const followUpMeta = needsFollowup ? {
          followup_at: new Date(fields.next_followup_at.value).toISOString(),
          followup_note: fields.next_followup_note.value.trim() || null,
          followup_prev_at: c.next_followup_at || null,
        } : null;

        // 1. Log the activity itself
        const { error: aErr } = await supabase.from('campaign_activities').insert({
          campaign_id: c.id, user_id: state.me.user_id,
          activity_type: fields.activity_type.value, note: fields.note.value.trim() || null,
          metadata: followUpMeta,
        });
        if (aErr) { submitBtn.disabled = false; submitBtn.textContent = 'Save'; return toast(aErr.message, 'error'); }

        // 2. Update campaign (sub_status, mandatory fields, follow-up)
        const payload = {};
        if (target) payload.sub_status = target;

        if (target === 'Gone Live') {
          payload.gone_live_date = fields.gone_live_date.value || null;
          payload.spends_inr     = fields.spends_inr.value ? parseFloat(fields.spends_inr.value) : null;
          payload.utm_link       = fields.utm_link.value.trim() || null;
          payload.utm_medium     = fields.utm_medium.value.trim() || null;
          payload.utm_content    = fields.utm_content.value || null;
          payload.is_recollab    = fields.is_recollab.value === 'true' ? true : fields.is_recollab.value === 'false' ? false : null;
          payload.rcb_count      = fields.rcb_count.value ? parseInt(fields.rcb_count.value) : null;
        }
        if (target === 'Post Gone Live') {
          payload.gone_live_link    = fields.gone_live_link.value.trim() || null;
          payload.insights          = fields.insights.value.trim() || null;
          payload.google_drive_link = fields.google_drive_link.value.trim() || null;
        }
        if (fields._file && fields._file.files[0]) {
          const path = await uploadCampaignFile(c.id, fields._fileKind, fields._file.files[0]);
          if (!path) { submitBtn.disabled = false; submitBtn.textContent = 'Save'; return; }
          payload[`${fields._fileKind}_file_url`] = path;
        }
        if (needsFollowup) {
          payload.next_followup_at   = new Date(fields.next_followup_at.value).toISOString();
          payload.next_followup_note = fields.next_followup_note.value.trim() || null;
        }

        if (Object.keys(payload).length) {
          const { error: cErr } = await supabase.from('campaigns').update(payload).eq('id', c.id);
          if (cErr) { submitBtn.disabled = false; submitBtn.textContent = 'Save'; return toast(cErr.message, 'error'); }

          if (target && target !== c.sub_status) {
            await supabase.from('campaign_activities').insert({
              campaign_id: c.id, user_id: state.me.user_id, activity_type: 'stage_change',
              note: `${c.sub_status} → ${target}`,
              metadata: { from: c.sub_status, to: target, ...(followUpMeta || {}) },
            });
          }
        }

        modal.close();
        toast('Saved', 'success');
        if (target === 'Gone Live') celebrateGoneLive();
        await fetchCampaignDetail(c.id);
        render();
      });

      wrap.appendChild(el('div', { class: 'flex justify-end gap-2 pt-3 mt-3 border-t border-stone-200' },
        el('button', { class: 'px-3 py-1.5 text-sm rounded-lg border border-stone-200 bg-white hover:bg-stone-50', onClick: () => modal.close() }, 'Cancel'),
        submitBtn
      ));

      const modal = renderModal('Log Activity', wrap);
    }

    // Lets an already-Gone-Live campaign's details (date/spends/UTM/collab type) be edited directly —
    // useful for regenerating a UTM link after the format changes, without touching sub_status.
    function openEditGoneLiveModal(c) {
      const fields = {};
      const wrap = el('div', { class: 'space-y-3' });

      fields.gone_live_date = el('input', { type: 'date', value: c.gone_live_date || '', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
      fields.spends_inr     = el('input', { type: 'number', step: '0.01', value: c.spends_inr ?? '', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });

      // Reverse-detect courseId/fmt (and matching Subject) from the campaign's existing UTM link,
      // so changing any other field regenerates correctly without forcing a fresh Subject pick.
      let detectedCourseId = '', detectedFmt = '', detectedSubject = '';
      try {
        const u = new URL(c.utm_link || '', 'https://x');
        detectedCourseId = u.searchParams.get('courseId') || '';
        detectedFmt = u.searchParams.get('fmt') || '';
        detectedSubject = Object.keys(SUBJECT_COURSE_MAP).find(s =>
          SUBJECT_COURSE_MAP[s].courseId === detectedCourseId && SUBJECT_COURSE_MAP[s].fmt === detectedFmt) || '';
      } catch {}

      fields._course_id     = el('input', { type: 'hidden', value: detectedCourseId });
      fields._fmt            = el('input', { type: 'hidden', value: detectedFmt });
      fields._subject        = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' },
        el('option', { value: '' }, '— Pick to regenerate link —'),
        ...Object.keys(SUBJECT_COURSE_MAP).map(s => el('option', { value: s, selected: s === detectedSubject }, s))
      );
      fields._subject.addEventListener('change', () => {
        const m = SUBJECT_COURSE_MAP[fields._subject.value];
        fields._course_id.value = m ? m.courseId : '';
        fields._fmt.value = m ? m.fmt : '';
        buildUtmLink(c, fields);
      });
      fields.utm_link       = el('input', { type: 'url', value: c.utm_link || '', class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' });
      fields.utm_medium     = el('input', { type: 'hidden', value: c.utm_medium || '' });
      fields.utm_content    = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' },
        el('option', { value: '' }, '—'),
        ...(state.filterOptions?.utm_content || []).map(u => el('option', { value: u, selected: c.utm_content === u }, u))
      );
      fields.utm_content.addEventListener('change', () => buildUtmLink(c, fields));
      fields.is_recollab    = el('select', { class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg' },
        el('option', { value: '', selected: c.is_recollab == null }, '—'),
        el('option', { value: 'false', selected: c.is_recollab === false }, 'New collab'),
        el('option', { value: 'true', selected: c.is_recollab === true }, 'Re-collab (RCB)')
      );
      fields.rcb_count      = el('input', { type: 'number', value: c.rcb_count ?? '', disabled: !c.is_recollab, class: 'mt-1 w-full px-3 py-2 text-sm border border-stone-300 rounded-lg disabled:bg-stone-100' });
      fields.is_recollab.addEventListener('change', () => { fields.rcb_count.disabled = fields.is_recollab.value !== 'true'; buildUtmLink(c, fields); });
      fields.gone_live_date.addEventListener('input', () => buildUtmLink(c, fields));

      wrap.appendChild(el('p', { class: 'text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1.5' },
        'Pick a Subject below to regenerate the UTM Link in the current format. Leave it on "—" to keep the UTM Link as-is and just edit the other fields.'
      ));
      [
        ['Gone Live Date', fields.gone_live_date],
        ['Spends (₹)', fields.spends_inr],
        ['Subject (regenerates UTM Link)', fields._subject],
        ['UTM Link (editable)', fields.utm_link],
        ['UTM Medium *', fields.utm_content],
        ['UTM Content *', fields.is_recollab],
        ['RCB Count (if Re-collab)', fields.rcb_count],
      ].forEach(([lbl, inp]) => wrap.appendChild(el('label', { class: 'block' }, el('span', { class: 'text-xs font-medium text-stone-600' }, lbl), inp)));

      const submitBtn = el('button', { class: 'px-3 py-1.5 text-sm rounded-lg btn-brand' }, 'Save changes');
      submitBtn.addEventListener('click', async () => {
        const payload = {
          gone_live_date: fields.gone_live_date.value || null,
          spends_inr:     fields.spends_inr.value ? parseFloat(fields.spends_inr.value) : null,
          utm_link:       fields.utm_link.value.trim() || null,
          utm_medium:     fields.utm_medium.value.trim() || null,
          utm_content:    fields.utm_content.value || null,
          is_recollab:    fields.is_recollab.value === 'true' ? true : fields.is_recollab.value === 'false' ? false : null,
          rcb_count:      fields.rcb_count.value ? parseInt(fields.rcb_count.value) : null,
        };
        submitBtn.disabled = true; submitBtn.textContent = 'Saving…';
        const { error } = await supabase.from('campaigns').update(payload).eq('id', c.id);
        submitBtn.disabled = false; submitBtn.textContent = 'Save changes';
        if (error) return toast(error.message, 'error');
        modal.close();
        toast('Gone Live details updated', 'success');
        await fetchCampaignDetail(c.id);
        render();
      });

      wrap.appendChild(el('div', { class: 'flex justify-end gap-2 pt-3 mt-2 border-t border-stone-200' },
        el('button', { class: 'px-3 py-1.5 text-sm rounded-lg border border-stone-200 bg-white hover:bg-stone-50', onClick: () => modal.close() }, 'Cancel'),
        submitBtn
      ));
      const modal = renderModal('Edit Gone Live Details', wrap);
    }

    // ===============================================================
    // DELETE (admin only)
    // ===============================================================
    async function deleteCampaign(c) {
      if (state.me?.role !== 'admin') return toast('Only admins can delete', 'error');
      const ok = await confirmModal(`Delete campaign "${c.name}" for ${c.platform?.profile?.name || 'this influencer'}? This also removes its activity log and change history. This cannot be undone.`);
      if (!ok) return;
      await supabase.from('campaign_activities').delete().eq('campaign_id', c.id);
      await supabase.from('campaign_audit').delete().eq('campaign_id', c.id);
      const { data, error } = await supabase.from('campaigns').delete().eq('id', c.id).select();
      if (error) return toast(error.message, 'error');
      if (!data || !data.length) return toast('Nothing was deleted — admins may need a DELETE policy in Supabase RLS', 'error');
      toast('Campaign deleted', 'success');
      window.location.hash = '#campaigns';
    }

    async function deleteProfile(p) {
      if (state.me?.role !== 'admin') return toast('Only admins can delete', 'error');
      const ok = await confirmModal(`Delete influencer "${p.name}" and ALL their platforms, campaigns, activity and history? This cannot be undone.`);
      if (!ok) return;
      const { data: platforms } = await supabase.from('platforms').select('id').eq('profile_id', p.id);
      const platformIds = (platforms || []).map(x => x.id);
      let campaignIds = [];
      if (platformIds.length) {
        const { data: camps } = await supabase.from('campaigns').select('id').in('platform_id', platformIds);
        campaignIds = (camps || []).map(x => x.id);
      }
      if (campaignIds.length) {
        await supabase.from('campaign_activities').delete().in('campaign_id', campaignIds);
        await supabase.from('campaign_audit').delete().in('campaign_id', campaignIds);
        await supabase.from('campaigns').delete().in('id', campaignIds);
      }
      if (platformIds.length) await supabase.from('platforms').delete().in('id', platformIds);
      const { data, error } = await supabase.from('profiles').delete().eq('id', p.id).select();
      if (error) return toast(error.message, 'error');
      if (!data || !data.length) return toast('Nothing was deleted — admins may need a DELETE policy in Supabase RLS', 'error');
      toast('Influencer deleted', 'success');
      window.location.hash = '#profiles';
    }

    // ===============================================================
    // YOUTUBE DISCOVERY
    // Searches YouTube channels via the YouTube Data API v3 (key stored per browser),
    // computes avg views of the latest 3 / 7 videos, pulls contacts from descriptions,
    // flags channels already in the CRM, and pre-fills Add Profile.
    // ===============================================================
    const YT_API = 'https://www.googleapis.com/youtube/v3/';
    const YT_KEY_LS = 'bc_yt_api_key';
    const YT_COUNTRY_NAMES = { IN: 'India', US: 'United States', GB: 'United Kingdom', AE: 'United Arab Emirates', CA: 'Canada', AU: 'Australia', SG: 'Singapore', SA: 'Saudi Arabia', QA: 'Qatar', NZ: 'New Zealand', MY: 'Malaysia', NP: 'Nepal', LK: 'Sri Lanka', BD: 'Bangladesh', PK: 'Pakistan',
      ID: 'Indonesia', PH: 'Philippines', TH: 'Thailand', VN: 'Vietnam', JP: 'Japan', KR: 'South Korea', DE: 'Germany', FR: 'France', ES: 'Spain', IT: 'Italy', NL: 'Netherlands', BR: 'Brazil', MX: 'Mexico',
      ZA: 'South Africa', NG: 'Nigeria', KE: 'Kenya', TR: 'Turkey', IE: 'Ireland', KW: 'Kuwait', OM: 'Oman', BH: 'Bahrain', EG: 'Egypt' };
    const DISC = {
      form: {
        terms: 'mom vlog india\nparenting india\nkids activities hindi',
        region: '', lang: '', perTerm: '50', minSubs: '5000', maxSubs: '', activeDays: '90',
        longOnly: true, countryOnly: false, location: '', locWords: null,
        searchType: 'video',      // 'video' finds creators through their video titles (much wider than channel-name search)
        importText: '',
      },
      results: [], running: false, stop: false, quota: 0,
      status: '', statusErr: false, progress: 0,
      crmKeys: null,            // Map normalized handle / channel id -> profile_id
      crmEmails: new Map(),     // email -> profile_id
      filter: '', hideCrm: false, emailOnly: false, locOnly: false, indianOnly: false, basedOnly: false, hideKids: true, genre: '',
      sortKey: 'avg7', sortDir: -1,
    };
    const ytHasBuiltInKey = () => !!YT_API_KEY && YT_API_KEY !== 'PASTE_YOUTUBE_API_KEY_HERE';
    const ytGetKey = () => {
      if (ytHasBuiltInKey()) return YT_API_KEY;
      try { return localStorage.getItem(YT_KEY_LS) || ''; } catch { return ''; }
    };
    const ytSetKey = (k) => { try { localStorage.setItem(YT_KEY_LS, k); return true; } catch { return false; } };
    const ytNum = (n) => n == null ? '—' : Number(n).toLocaleString('en-IN');

    async function ytCall(endpoint, params, cost) {
      const url = YT_API + endpoint + '?' + new URLSearchParams({ ...params, key: ytGetKey() });
      const res = await fetch(url);
      DISC.quota += cost;
      DISC.pendingUnits = (DISC.pendingUnits || 0) + cost;
      if (endpoint === 'search') DISC.pendingSearches = (DISC.pendingSearches || 0) + 1;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const reason = data?.error?.errors?.[0]?.reason || '';
        let msg = data?.error?.message || res.statusText;
        if (['quotaExceeded', 'dailyLimitExceeded', 'rateLimitExceeded'].includes(reason) || /quota/i.test(msg)) {
          DISC.usageExhausted = true; discRenderUsage();
          msg = `Today’s YouTube search limit is used up. You can search again after ${ytResetText()}. Searches already done in the last 3 days still work.`;
        }
        else if (reason === 'keyInvalid' || /API key not valid/i.test(msg)) msg = 'The YouTube API key is not valid. Check it in Google Cloud Console → Credentials.';
        else if (/referer|referrer/i.test(msg)) msg = 'The API key is restricted to other websites. Add this site under Application restrictions in Google Cloud.';
        const e = new Error(msg);

    // YouTube's daily limit resets at midnight US Pacific time. Show that in the viewer's own time,
    // e.g. "12:30 PM today (in 2 hr 15 min)".
    function ytResetText() {
      const now = new Date();
      const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit',
      }).formatToParts(now).map(p => [p.type, p.value]));
      const sinceMidnight = ((+parts.hour % 24) * 3600 + (+parts.minute) * 60 + (+parts.second)) * 1000;
      const reset = new Date(now.getTime() - sinceMidnight + 86400000);
      const time = reset.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true }).toUpperCase();
      const sameDay = reset.toDateString() === now.toDateString();
      const mins = Math.max(1, Math.round((reset - now) / 60000));
      const wait = mins >= 60 ? `${Math.floor(mins / 60)} hr ${mins % 60} min` : `${mins} min`;
      return `${time} ${sameDay ? 'today' : 'tomorrow'} (in ${wait})`;
    }

    // Saved search results (per browser, 3 days) so repeating a search costs nothing.
    const YT_CACHE_LS = 'bc_yt_search_cache_v1';
    const YT_CACHE_TTL = 3 * 86400000;
    function ytCacheGet(key) {
      try {
        const all = JSON.parse(localStorage.getItem(YT_CACHE_LS) || '{}');
        const hit = all[key];
        return hit && Date.now() - hit.t < YT_CACHE_TTL ? hit.d : null;
      } catch { return null; }
    }
    function ytCacheSet(key, data) {
      try {
        const all = JSON.parse(localStorage.getItem(YT_CACHE_LS) || '{}');
        all[key] = { t: Date.now(), d: data };
        const keys = Object.keys(all).filter(k => Date.now() - all[k].t < YT_CACHE_TTL)
          .sort((a, b) => all[b].t - all[a].t).slice(0, 400);
        localStorage.setItem(YT_CACHE_LS, JSON.stringify(Object.fromEntries(keys.map(k => [k, all[k]]))));
      } catch { /* storage full or blocked: skip caching */ }
    }
    async function ytSearchCached(params) {
      const key = JSON.stringify([params.type, params.q.toLowerCase().trim(), params.regionCode || '', params.relevanceLanguage || '', params.maxResults, params.pageToken || '']);
      const cached = ytCacheGet(key);
      if (cached) { DISC.cacheHits = (DISC.cacheHits || 0) + 1; return cached; }
      const slim = await ytCall('search', params, 100);
      const data = { items: (slim.items || []).map(it => ({ id: { channelId: it.id?.channelId }, snippet: { channelId: it.snippet?.channelId || it.id?.channelId } })), nextPageToken: slim.nextPageToken || '' };
      ytCacheSet(key, data);
      return data;
    }

      'Knowledge': 'Infotainment', 'Technology': 'Infotainment', 'Health': 'Nutrition',
    };
    const DISC_GENRE_RX = Object.fromEntries(Object.entries(DISC_GENRE_WORDS).map(([g, words]) =>
      [g, new RegExp('(?:^|[^a-z0-9])(' + words.map(w => w.replace(/ /g, '\\s*')).join('|') + ')(?=$|[^a-z0-9])', 'gi')]));

    function discDetectGenre({ title, description, keywords, videoTitles, topics }) {
      const scores = Object.fromEntries(DISC_GENRES.map(g => [g, 0]));
      const count = (text, rx) => (String(text || '').match(rx) || []).length;
      for (const g of DISC_GENRES) {
        const rx = DISC_GENRE_RX[g];
        scores[g] += 4 * Math.min(2, count(title, rx));
        scores[g] += 2 * Math.min(4, count(description, rx));
        scores[g] += 2 * Math.min(3, count(keywords, rx));
        scores[g] += Math.min(8, videoTitles.reduce((a, t) => a + (count(t, rx) ? 1 : 0), 0));
      }
      for (const url of topics || []) {
        const g = DISC_TOPIC_GENRE[decodeURIComponent(String(url).split('/wiki/')[1] || '')];
        if (g) scores[g] += 3;
      }
      // Generic words like "vlog" push Lifestyle up; let a specific genre win ties.
      const ranked = DISC_GENRES.map(g => [g, scores[g] - (g === 'Lifestyle' ? 0.5 : 0)]).sort((a, b) => b[1] - a[1]);
      const [top, topScore] = ranked[0];
      if (topScore < 3) return { genre: '', also: [] };
      const also = ranked.slice(1).filter(([, sc]) => sc >= 3 && sc >= topScore * 0.5).slice(0, 2).map(([g]) => g);
      return { genre: top, also };
    }

    // Search phrases used when parenting is combined with another topic ("moms who cook", "family travel")
    const DISC_NL_WITH_KIDS = {

    function discParseSentence(text) {
      const raw = String(text || '').toLowerCase().replace(/[^a-z0-9\s+]/g, ' ').replace(/\s+/g, ' ').trim();
      const has = (w) => new RegExp('(?:^|\\s)' + w.replace(/ /g, '\\s') + 's?(?=\\s|$)').test(raw);

      const lang = DISC_NL_LANGS.find(l => l.words.some(has)) || null;

      // Subscriber size hints: "under 50k", "above 1 lakh", "micro", "small", "big"
      const toNum = (n, unit) => {
        const v = parseFloat(n);
        if (!unit) return v;
        if (unit.startsWith('k')) return v * 1000;
        if (unit.startsWith('l')) return v * 100000;
        if (unit.startsWith('m')) return v * 1000000;
        return v;
      };
      let minSubs = null, maxSubs = null;
      const under = /(?:under|below|less than|upto|up to|max)\s*(\d+(?:\.\d+)?)\s*(k|lakh|lakhs|lac|m|million)?/.exec(raw);

      if (under) maxSubs = toNum(under[1], under[2]);
      if (over) minSubs = toNum(over[1], over[2]);
      if (has('nano')) { minSubs ??= 1000; maxSubs ??= 10000; }
      if (has('micro') || has('small')) { minSubs ??= 10000; maxSubs ??= 100000; }
      if (has('mid') || has('medium')) { minSubs ??= 100000; maxSubs ??= 500000; }
      if (has('big') || has('large') || has('macro') || has('top')) { minSubs ??= 500000; }

      // Location: most specific first (city > state > country). Prefer places abroad if several match.
      const placeHits = DISC_NL_PLACES.filter(p => p.words.some(has));
      const place = placeHits.find(p => p.t === 'city' && p.c !== 'IN') || placeHits.find(p => p.t === 'city')
        || placeHits.find(p => p.c !== 'IN') || placeHits[0] || null;
      const matchedCountries = DISC_NL_COUNTRIES.filter(c => c.words.some(has));
      const country = (place && DISC_NL_COUNTRIES.find(c => c.code === place.c))
        || matchedCountries.find(c => c.code !== 'IN') || matchedCountries[0] || null;
      const abroad = country && country.code !== 'IN' ? country : null;
      // Word to add into searches: the city/state (unless it only implies the language), else a foreign country
      const locWord = place && !place.langState ? place.label.toLowerCase()
        : (abroad ? abroad.word : null);
      // Does the person want Indian / desi creators? (only then do we use "indian", "desi", "nri" words)
      const wantIndian = !!lang || has('indian') || has('desi') || has('nri') || (country && country.code === 'IN');
      const L = lang ? lang.name : (wantIndian ? (abroad ? 'indian' : 'india') : (country ? country.word : ''));
      let terms = [];
      if (picked.length) {
        const parenting = picked.find(t => t.genre === 'Parenting');
        const other = picked.find(t => t.genre !== 'Parenting');
        if (parenting && other) {
          // e.g. "tamil moms who cook" -> mix both
          terms.push(...(DISC_NL_WITH_KIDS[other.genre] || []).map(t => t.replace('{L}', L)));
          terms.push(...parenting.terms.slice(0, 4).map(t => t.replace('{L}', L)));
        } else {
          picked.forEach(t => terms.push(...t.terms.map(x => x.replace('{L}', L))));
        }
        if (parenting && lang && DISC_NL_LOCAL_PARENTING[lang.code]) terms.push(...DISC_NL_LOCAL_PARENTING[lang.code]);
      } else {
        // Nothing recognised: use the meaningful words from the sentence as one search
        const words = raw.split(' ').filter(w => w && !DISC_NL_STOP.has(w) && !/^\d/.test(w));
        if (words.length) terms.push([...(lang && !words.includes(lang.name) ? [lang.name] : []), ...words].join(' '));
      }
      // Living abroad (e.g. "tamil families in usa"): put the country into the searches
      if (locWord && terms.length) {
        const W = locWord;
        const base = terms.filter(t => !(lang && DISC_NL_LOCAL_PARENTING[lang.code]?.includes(t))).slice(0, 5).map(t => `${t} ${W}`);
        const isParenting = picked.some(t => t.genre === 'Parenting');
        if (abroad && !lang && !wantIndian) {
          // Local creators of that country/place (e.g. "creators in Indonesia"): use the place name + local-language phrases
          const native = (abroad.native || []);
          terms = isParenting
            ? [...native.slice(0, 4), `${W} mom vlog`, `${W} family vlog`, `mom life in ${W}`, `${W} parenting`, `family vlog ${W}`]
            : picked.flatMap(t => t.terms.slice(0, 3)).map(t => t.replace('{L}', W));   // local phrases are parenting-specific
        } else {
          // Indians abroad ("tamil families in uk", "indian moms in usa").
          // Diaspora creators title videos like "UK Tamil vlog", "Life in UK", "Tamil family in London",
          // so put the place first/last in natural phrases and add the main diaspora cities when only a country was given.
          const P = lang ? L : 'indian';
          const hubs = !place && abroad ? (DISC_DIASPORA_HUBS[abroad.code] || []) : [];   // only when just a country was given
          terms = isParenting
            ? [`${P} family in ${W}`, `${W} ${P} vlog`, `${P} mom in ${W}`, `life in ${W} ${P}`, `${P} family vlog ${W}`,
               ...(lang ? [`${P} couple in ${W}`] : [`desi mom in ${W}`, `nri family vlog ${W}`]),
               ...hubs.slice(0, 2).map(h => `${P} family in ${h}`), `${W} ${P} kids`]
            : [`${P} in ${W}`, `${W} ${P} vlog`, `life in ${W} ${P}`, `${P} vlog ${W}`,
               ...picked.flatMap(t => t.terms.slice(0, 2)).map(t => `${t.replace('{L}', P)} ${W}`),
               ...hubs.slice(0, 1).map(h => `${P} vlog ${h}`)];

      terms = [...new Set(terms.map(t => t.replace(/\s+/g, ' ').trim()))].slice(0, 8);

      return {
        region: country ? country.code : '',
        countryLabel: country ? country.label : '',
        placeLabel: place && !place.langState ? place.label : '',
        // For a country, a mention of any of its states/cities also counts (e.g. "usa" matches a channel saying "Texas")
        locWords: place && !place.langState ? place.words
          : (abroad ? [...abroad.words, ...DISC_NL_PLACES.filter(p => p.c === abroad.code).flatMap(p => p.words)] : []),
        wantIndian: !!abroad && !!(lang || has('indian') || has('desi') || has('nri')),
        countryLang: abroad && !lang && !(has('indian') || has('desi') || has('nri')) ? (abroad.lang || '') : '',
        lang: lang ? lang.code : '',
        langName: lang ? lang.name.charAt(0).toUpperCase() + lang.name.slice(1) : '',
        genre: picked[0]?.genre || '',

    }

    function discRunSentence(text) {
      const q = discParseSentence(text);
      if (!q.terms.length) {

      f.sentence = text;
      f.terms = q.terms.join('\n');
      f.region = q.region;       // no region filter unless a country is mentioned
      f.lang = q.lang || q.countryLang;   // e.g. Indonesia -> Indonesian when no language was given
      f.location = q.placeLabel || (q.region && q.region !== 'IN' ? q.countryLabel : '');

      f.searchType = f.searchType || 'video';
      DISC.lastPlan = q;
      DISC.indianOnly = q.wantIndian;   // abroad + Indian: hide non-Indian creators by default
      DISC.basedOnly = !!(q.region && q.region !== 'IN');  // "in usa" means they live there, not just popular there
      render();                       // show the filled-in search terms and filters
      runDiscover();
    }


    // ---------------------------------------------------------------
    // Team-wide daily usage meter (stored in Supabase table yt_api_usage).
    // YouTube does not report remaining quota, so the CRM counts every call it makes.
    // ---------------------------------------------------------------
    const YT_DAILY_UNITS = 10000;          // Google's default daily quota; change if Google raises it
    const YT_UNITS_PER_SEARCH_TERM = 200;  // rough cost of one search line incl. channel/video lookups
    DISC.usage = null;                      // { units, searches } for today (US Pacific day), or null if unavailable
    const ytPacificDay = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());

    async function discLoadUsage() {
      try {
        const { data, error } = await supabase.from('yt_api_usage').select('day, units, searches').eq('day', ytPacificDay()).maybeSingle();
        if (error) { DISC.usage = null; DISC.usageUnavailable = true; return; }
        DISC.usageUnavailable = false;
        DISC.usage = { units: data?.units || 0, searches: data?.searches || 0 };
        if (DISC.usageDay !== ytPacificDay()) { DISC.usageDay = ytPacificDay(); DISC.usageExhausted = false; }
      } catch { DISC.usage = null; DISC.usageUnavailable = true; }
      discRenderUsage();
    }

    async function discFlushUsage() {
      const units = DISC.pendingUnits || 0, searches = DISC.pendingSearches || 0;
      if (!units && !searches) return;
      DISC.pendingUnits = 0; DISC.pendingSearches = 0;
      try {
        const { data, error } = await supabase.rpc('yt_usage_add', { p_units: units, p_searches: searches });
        if (error) throw error;
        const row = Array.isArray(data) ? data[0] : data;
        if (row) DISC.usage = { units: row.units || 0, searches: row.searches || 0 };
        DISC.usageUnavailable = false;
      } catch {
        // Table not set up yet: keep a local estimate so the meter still moves for this person
        if (DISC.usage) DISC.usage = { units: DISC.usage.units + units, searches: DISC.usage.searches + searches };
      }
      discRenderUsage();
    }

    function discRenderUsage() {
      const host = document.getElementById('disc-usage');
      if (!host) return;
      if (!DISC.usage && !DISC.usageExhausted) {
        host.innerHTML = DISC.usageUnavailable
          ? '<span class="text-xs text-stone-400">Daily usage meter is not set up yet (needs the yt_api_usage table in Supabase).</span>' : '';
        return;
      }
      const units = DISC.usage?.units || 0;
      const pct = DISC.usageExhausted ? 100 : Math.min(100, Math.round(100 * units / YT_DAILY_UNITS));
      const left = DISC.usageExhausted ? 0 : Math.max(0, Math.floor((YT_DAILY_UNITS - units) / YT_UNITS_PER_SEARCH_TERM));
      const color = pct >= 90 ? '#dc2626' : pct >= 60 ? '#d97706' : '#059669';
      const headline = DISC.usageExhausted
        ? `Limit reached for today. Searching opens again at ${ytResetText()}.`
        : `${pct}% of today’s team limit used · about ${left} more search line${left === 1 ? '' : 's'} left`;
      host.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
          <span class="font-medium" style="color:${color}">${escape(headline)}</span>
          <span class="text-stone-400">${ytNum(DISC.usage?.searches || 0)} searches today · resets ${escape(ytResetText())}</span>
        </div>
        <div class="h-2 bg-stone-100 rounded mt-1.5 overflow-hidden">
          <div class="h-full rounded" style="width:${pct}%; background:${color}"></div>
        </div>`;

    async function fetchDiscover() {
      if (!DISC.crmKeys) await loadDiscoverCrm();

    function discSetStatus(msg, isErr = false) {
      DISC.status = msg; DISC.statusErr = isErr;

      if (n) { n.textContent = msg; n.className = 'text-sm ' + (isErr ? 'text-rose-600' : 'text-stone-500'); }
    }
    function discSetProgress(p) {
      DISC.progress = Math.max(0, Math.min(100, p));
